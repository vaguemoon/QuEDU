<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生字圖卡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
:root {
  --card-border: #b8d4f0;
  --text-dark:   #1a2c3e;
  --text-muted:  #5a7a9a;
  --blue:        #4a90d9;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: #eef3f9;
  color: var(--text-dark);
}

/* ── Screen header ── */
#page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 24px;
  background: white;
  border-bottom: 1px solid #d0dcea;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

#lesson-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-dark);
}

#loading-status {
  font-size: .8rem;
  color: var(--text-muted);
  margin-top: 2px;
}

#btn-print {
  flex-shrink: 0;
  padding: 9px 22px;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: .92rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  opacity: .45;
  pointer-events: none;
  transition: opacity .25s;
}
#btn-print.ready            { opacity: 1; pointer-events: auto; }
#btn-print.ready:hover      { background: #2d6fa8; }

/* ── Cards wrapper (screen) ── */
#cards-wrapper {
  padding: 28px 24px;
  max-width: 860px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* ── One A4 page (screen: 2×2 preview) ── */
.print-page {
  display: flex;
  flex-direction: column;
  background: white;
  padding: 20px;
  border-radius: 6px;
  border: 1px solid #ccdaea;
  box-shadow: 0 3px 12px rgba(0,0,0,.09);
}

/* 第一頁專用：班級／姓名填寫列 */
.print-page-header {
  display: flex;
  gap: 24px;
  padding-bottom: 10px;
  margin-bottom: 14px;
  border-bottom: 1px dashed #ccdaea;
  font-size: .85rem;
  font-weight: 600;
  color: var(--text-dark);
}
.print-page-header .fill-line {
  display: inline-block;
  min-width: 110px;
  height: 1em;
  margin-left: 4px;
  border-bottom: 1px solid #8aa8c8;
  vertical-align: bottom;
}

/* 每頁都印一次的課次標籤，取代原本每張卡片各印一次 */
.print-page-lesson {
  font-size: .78rem;
  color: var(--text-muted);
  font-weight: 600;
  text-align: center;
  margin-bottom: 8px;
  flex-shrink: 0;
}

/* 卡片版面：一欄，每頁固定 5 張（見 cards.js 的 CARDS_PER_PAGE） */
.print-page-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  flex: 1;
}

/* ── Single card ── */
.char-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px;
  border: 1.5px solid var(--card-border);
  border-radius: 10px;
  background: white;
}

/* 注音：直排字母 + 橫排聲調符號 */
.zy-wrapper {
  display: inline-flex;
  flex-direction: row;
  align-items: center;
  gap: 1px;
}

.zy-body {
  writing-mode: vertical-rl;
  text-orientation: upright;
  letter-spacing: .08em;
  font-size: inherit;
}

/* 聲調符號不旋轉，維持橫向顯示，垂直位置由 JS 依聲調設定 */
.zy-tone {
  writing-mode: horizontal-tb;
  font-size: .65em;
  line-height: 1;
}

/* 田字格用的字方塊（CSS Grid stacking，避免 position:absolute
   在部分列印引擎失效）：hz-target 放大字、tian-svg 疊十字虛線，
   .hzp-unit-char 就是用這兩個組合出來的 */
.hz-target {
  grid-area: 1 / 1;
  min-width: 0;
  min-height: 0;
}
.hz-target svg {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

.tian-svg {
  grid-area: 1 / 1;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  position: relative;
}

/* 遮蔽練習：疊在最上層，蓋住底下的字跡與田字格線，
   讓學生只能靠記憶補上被蓋住的部分 */
.mask-overlay {
  grid-area: 1 / 1;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
  position: relative;
}

/* 第一格的仿寫底稿（HanziWriter 極淡字形） */
.practice-hz {
  grid-area: 1 / 1;
  min-width: 0;
  min-height: 0;
}
.practice-hz svg {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

.practice-tian {
  grid-area: 1 / 1;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  position: relative;
}

/* ══════════════════════════════════════
   測驗單：只有遮蔽字，5 個一行、置中排列，
   不含注音／部首／造詞／寫字格 ══════════════════════════════════════ */
.test-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  justify-content: center;
}
.test-box {
  width: 100px;
  height: 100px;
  flex-shrink: 0;
  border: 1.5px solid var(--card-border);
  border-radius: 8px;
  overflow: hidden;
  background: white;
  display: grid;
  grid-template: 1fr / 1fr;
}

/* ══════════════════════════════════════
   橫式生字練習格（學習單，目前唯一的卡片版型）
══════════════════════════════════════ */
.hzp-card {
  flex-direction: column;
  align-items: flex-start;
}

.hzp-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
}

/* 每一格（參考格／練習格）都是同一種「格子」：單一圓角外框，
   左半是字、右半是注音，中間用內部的 border-left 隔開——
   外框只在最外層的 .hzp-unit 畫一次，兩個半邊本身完全沒有自己的
   邊框／圓角，才會看起來像「同一個格子被劃開兩半」，而不是
   兩個各自獨立的形狀拼在一起 */
.hzp-unit {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  border: 1.5px solid var(--card-border);
  border-radius: 8px;
  overflow: hidden;
  background: white;
  flex-shrink: 0;
}
.hzp-unit-char {
  width: 72px;
  height: 72px;
  flex-shrink: 0;
  display: grid;
  grid-template: 1fr / 1fr;
}
.hzp-unit-zy {
  width: 30px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-dark);
  border-left: 1.5px solid var(--card-border);
}
/* 仿寫底稿那一格的注音也是淡色描摹用，不是正確答案參考 */
.hzp-unit-zy.faint { color: rgba(74, 144, 217, .4); }

.hzp-word-line {
  display: flex;
  align-items: baseline;
  gap: 10px;
  width: 100%;
  margin-top: 8px;
}
.hzp-radical-title,
.hzp-radical-value {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-dark);
  flex-shrink: 0;
}
.hzp-radical-zy {
  font-size: .8rem;
  font-weight: 700;
  color: var(--text-dark);
  flex-shrink: 0;
  margin-right: 16px;
  display: inline-flex;
  align-items: center;
}
.hzp-word-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-dark);
  flex-shrink: 0;
}
.hzp-word-blank {
  flex: 1;
  height: 2.4em;
  border-bottom: 1.5px solid var(--text-dark);
}

/* ════════════════════════
   @media print
════════════════════════ */
@media print {
  @page { size: A4 portrait; margin: 10mm; }

  body { background: white; }
  #page-header { display: none; }

  #cards-wrapper {
    padding: 0;
    max-width: none;
    gap: 0;
  }

  .print-page {
    width:   190mm;
    height:  277mm;
    padding: 0;
    border: none;
    box-shadow: none;
    border-radius: 0;
    min-height: unset;
    page-break-after: always;
    break-after: page;
  }
  .print-page:last-child {
    page-break-after: auto;
    break-after: auto;
  }

  .print-page-lesson { font-size: 8pt; margin-bottom: 2mm; }

  .print-page-header {
    flex-shrink: 0;
    padding-bottom: 3mm;
    margin-bottom: 3mm;
    font-size: 10pt;
    border-bottom: 0.5pt dashed #8aa8c8;
  }
  .print-page-header .fill-line { min-width: 30mm; }

  /* 單欄、每頁固定 5 張，讓瀏覽器依內容自然決定每張卡片高度 */
  .print-page-grid {
    flex: 1;
    min-height: 0;
    gap: 3.5mm;
    grid-template-columns: 1fr;
    justify-content: stretch;
    align-content: start;
  }

  .char-card {
    page-break-inside: avoid;
    break-inside: avoid;
    padding: 3mm;
    gap: 2mm;
  }

  .hzp-card { padding: 2mm; }
  .hzp-row { gap: 2mm; }
  .hzp-unit { border-width: 1pt; border-radius: 3pt; }
  .hzp-unit-char { width: 22mm; height: 22mm; }
  .hzp-unit-zy { width: 9mm; font-size: 11pt; border-left-width: 1pt; }
  .hzp-word-line { font-size: 12pt; margin-top: 3mm; gap: 4mm; }
  .hzp-radical-title, .hzp-radical-value { font-size: 12pt; }
  .hzp-radical-zy { font-size: 9pt; margin-right: 5mm; }
  .hzp-word-blank { height: 10mm; }

  /* 測驗單：5 欄固定寬度的遮蔽字格，跟學習單完全獨立的一套版面 */
  .test-grid {
    flex: 1;
    min-height: 0;
    grid-template-columns: repeat(5, 1fr);
    gap: 2.5mm;
  }
  .test-box {
    width: 34mm;
    height: 34mm;
    border-width: 1pt;
    border-radius: 4pt;
    page-break-inside: avoid;
    break-inside: avoid;
  }
}
</style>
</head>
<body>

<div id="page-header">
  <div>
    <div id="lesson-title">生字圖卡</div>
    <div id="loading-status">載入中…</div>
  </div>
  <button id="btn-print" onclick="window.print()">⏳ 載入中…</button>
</div>

<div id="cards-wrapper"></div>

<script src="cards.js"></script>
</body>
</html>
