<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生字圖卡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
:root {
  --card-border: #b8d4f0;
  --text-dark:   #1a2c3e;
  --text-muted:  #5a7a9a;
  --blue:        #4a90d9;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: #eef3f9;
  color: var(--text-dark);
}

/* ── Screen header ── */
#page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 24px;
  background: white;
  border-bottom: 1px solid #d0dcea;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

#lesson-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-dark);
}

#loading-status {
  font-size: .8rem;
  color: var(--text-muted);
  margin-top: 2px;
}

#btn-print {
  flex-shrink: 0;
  padding: 9px 22px;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: .92rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  opacity: .45;
  pointer-events: none;
  transition: opacity .25s;
}
#btn-print.ready            { opacity: 1; pointer-events: auto; }
#btn-print.ready:hover      { background: #2d6fa8; }

/* ── Cards wrapper (screen) ── */
#cards-wrapper {
  padding: 28px 24px;
  max-width: 860px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* ── One A4 page (screen: 2×2 preview) ── */
.print-page {
  display: flex;
  flex-direction: column;
  background: white;
  padding: 20px;
  border-radius: 6px;
  border: 1px solid #ccdaea;
  box-shadow: 0 3px 12px rgba(0,0,0,.09);
}

/* 第一頁專用：班級／姓名填寫列 */
.print-page-header {
  display: flex;
  gap: 24px;
  padding-bottom: 10px;
  margin-bottom: 14px;
  border-bottom: 1px dashed #ccdaea;
  font-size: .85rem;
  font-weight: 600;
  color: var(--text-dark);
}
.print-page-header .fill-line {
  display: inline-block;
  min-width: 110px;
  height: 1em;
  margin-left: 4px;
  border-bottom: 1px solid #8aa8c8;
  vertical-align: bottom;
}

/* 每頁都印一次的課次標籤，取代原本每張卡片各印一次 */
.print-page-lesson {
  font-size: .78rem;
  color: var(--text-muted);
  font-weight: 600;
  text-align: center;
  margin-bottom: 8px;
  flex-shrink: 0;
}

/* 六張圖卡的 2×3 排版，獨立於頁面容器，加了表頭也不影響每頁六張 */
.print-page-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(3, auto);
  gap: 10px;
  flex: 1;
}

/* ── Single card ── */
.char-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px;
  border: 1.5px solid var(--card-border);
  border-radius: 10px;
  background: white;
}

/* Card body: side-info (left) + char-wrap (right) */
.card-body {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
}

/* Left side column: 注音 + 部首 */
.card-side-info {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-items: center;
  width: 52px;
  flex-shrink: 0;
  align-self: stretch;
  border-left: 1px solid #ddeaf8;
  padding: 6px 2px;
  gap: 6px;
}

.side-info-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.info-label {
  font-size: .55rem;
  color: var(--text-muted);
  font-weight: 600;
}

.info-value {
  font-size: .92rem;
  font-weight: 700;
  color: var(--text-dark);
  line-height: 1.1;
}

/* 注音：直排字母 + 橫排聲調符號 */
.info-zhuyin {
  display: flex;
  align-items: center;
  justify-content: center;
}

.zy-wrapper {
  display: inline-flex;
  flex-direction: row;
  align-items: center;
  gap: 1px;
}

.zy-body {
  writing-mode: vertical-rl;
  text-orientation: upright;
  letter-spacing: .08em;
  font-size: inherit;
}

/* 聲調符號不旋轉，維持橫向顯示，垂直位置由 JS 依聲調設定 */
.zy-tone {
  writing-mode: horizontal-tb;
  font-size: .65em;
  line-height: 1;
}

/* Char box with 田字格
   CSS Grid stacking avoids position:absolute which breaks in some print engines. */
.card-char-wrap {
  flex: 1;
  aspect-ratio: 1 / 1;
  display: grid;
  grid-template: 1fr / 1fr;
  border: 1.5px solid var(--card-border);
  border-radius: 7px;
  overflow: hidden;
  background: white;
  min-width: 0;
}

/* Both stack in same grid cell */
.hz-target {
  grid-area: 1 / 1;
  min-width: 0;
  min-height: 0;
}
.hz-target svg {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

.tian-svg {
  grid-area: 1 / 1;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  position: relative;
}

/* 遮蔽練習：疊在最上層（大字用灰色、練習格仿寫用白色），蓋住底下的
   字跡與田字格線，讓學生只能靠記憶補上被蓋住的部分 */
.mask-overlay {
  grid-area: 1 / 1;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
  position: relative;
}

/* ── Practice row (3 writing boxes, full card width) ── */
.practice-row {
  display: flex;
  flex-direction: row;
  gap: 6px;
  width: 100%;
  flex-shrink: 0;
}

.practice-box {
  flex: 1;
  aspect-ratio: 1 / 1;
  border: 1.5px solid var(--card-border);
  border-radius: 5px;
  overflow: hidden;
  background: white;
  display: grid;
  grid-template: 1fr / 1fr;
}

/* 第一格的仿寫底稿（HanziWriter 極淡字形） */
.practice-hz {
  grid-area: 1 / 1;
  min-width: 0;
  min-height: 0;
}
.practice-hz svg {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

.practice-tian {
  grid-area: 1 / 1;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  position: relative;
}

/* ════════════════════════
   @media print
════════════════════════ */
@media print {
  @page { size: A4 portrait; margin: 10mm; }

  body { background: white; }
  #page-header { display: none; }

  #cards-wrapper {
    padding: 0;
    max-width: none;
    gap: 0;
  }

  .print-page {
    width:   190mm;
    height:  277mm;
    padding: 0;
    border: none;
    box-shadow: none;
    border-radius: 0;
    min-height: unset;
    page-break-after: always;
    break-after: page;
  }
  .print-page:last-child {
    page-break-after: auto;
    break-after: auto;
  }

  .print-page-lesson { font-size: 8pt; margin-bottom: 2mm; }

  .print-page-header {
    flex-shrink: 0;
    padding-bottom: 3mm;
    margin-bottom: 3mm;
    font-size: 10pt;
    border-bottom: 0.5pt dashed #8aa8c8;
  }
  .print-page-header .fill-line { min-width: 30mm; }

  /* rows 用 auto（依內容決定高度），不要用 1fr 平分整頁高度——
     否則卡片高度不足時，align-items:center 會把每排卡片往中間擠，
     兩排之間就會擠出一大條空白。多出來的空間留在最後一排下方，不要分散到列與列之間 */
  /* 欄寬改用 max-content：卡片縮到剛好包住內容，避免方格縮小後
     卡片邊框內留下大片左右空白；兩欄整體再置中於頁面 */
  .print-page-grid {
    flex: 1;
    min-height: 0;
    gap: 3.5mm;
    grid-template-columns: repeat(2, max-content);
    grid-template-rows:    repeat(3, auto);
    justify-content: center;
    align-content: start;
  }

  .char-card {
    page-break-inside: avoid;
    break-inside: avoid;
    padding: 3mm;
    gap: 2mm;
  }

  /* 6 張一頁的高度預算很緊，大字方塊跟描摹格都要用明確的固定邊長，
     且下面三個描摹格的總寬度刻意算到跟大字那排的內容寬度完全對齊，
     這樣卡片內就不會再有多餘的左右留白（之前用 max-width 讓方格縮小、
     卡片仍撐滿欄寬，才會兩側留白；也不能再用 flex:1 撐滿欄寬，
     否則 3 排疊起來會超過 A4 高度，第 3 排被擠到下一頁） */
  .card-body { gap: 3mm; }

  .card-char-wrap { flex: 0 0 auto; width: 48mm; height: 48mm; }

  .card-side-info {
    width: 12mm;
    padding: 2mm 1mm;
    border-left: 0.5pt solid #ddeaf8;
  }

  .practice-row { gap: 2mm; margin-top: 1.5mm; }
  .practice-box { flex: 0 0 auto; width: 19.5mm; height: 19.5mm; border-width: 0.5pt; border-radius: 3pt; }

  .info-label { font-size: 6pt; }
  .info-value { font-size: 9.5pt; }
}
</style>
</head>
<body>

<div id="page-header">
  <div>
    <div id="lesson-title">生字圖卡</div>
    <div id="loading-status">載入中…</div>
  </div>
  <button id="btn-print" onclick="window.print()">⏳ 載入中…</button>
</div>

<div id="cards-wrapper"></div>

<script src="cards.js"></script>
</body>
</html>
