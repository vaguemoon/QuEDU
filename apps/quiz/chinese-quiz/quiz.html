    </div>

</div>

    answer: 'B', options: ['A. 比喻', 'B. 誇飾', 'C. 擬人'] }
];

/* ════════════ Constants ════════════ */
var TYPE_ORDER   = ['詞語填空', '詞語解釋', '選擇題', '句子重組', '默寫生字'];
var SECTION_NUMS = ['一', '二', '三', '四', '五', '六'];
var POOL_KEY     = { '詞語填空': 'fill', '詞語解釋': 'explain' };
var DROP_TOL     = 44;  /* px expanded hit area around each blank */
var DRAG_THOLD   = 8;   /* px movement needed to start drag vs tap */

/* ════════════ State ════════════ */
var db              = null;
var student         = null;
var currentSettings = null; /* { grade, lesson, lessonName, counts } */
var currentSession  = null; /* { sessionId, sessionCode, sessionName, teacherUid } */
var quizData        = [];
var poolOrder       = {};
var blanks          = {};   /* { qIdx: word | undefined } */
var mcAnswers       = {};   /* { qIdx: 'A'|'B'|'C' } */
var graded          = false;
var dragging        = null; /* active drag: { word, poolKey, fromQIdx, ghost } */
var pendingDrag     = null; /* pre-threshold: { word, poolKey, fromQIdx, sx, sy } */
var _dragY          = 0;    /* last known drag clientY — used by auto-scroll loop */
var _scrollRAF      = null; /* rAF id for drag auto-scroll */
var _countUpRAF     = null; /* rAF id for score count-up animation */
var matchData        = [];   /* [{title,pairs:[{wordId,word,imageUrl}],imgOrder:[],wordOrder:[]}] */
var matchConnections = {};   /* {si: {imgPos: wordPos}} */
var _matchConnDrag   = null; /* currently unused — drag state lives in `dragging` */

/* ── 句子重組：點詞卡依序放進空格（不用拖曳，特教生用 tap 比連續拖曳穩定） ── */
var srAnswers   = {};   /* qIdx -> [已放入的片段在 q.options 裡的原始索引]，陣列順序＝目前排的順序 */
var srBankUsed  = {};   /* qIdx -> {origIdx: true}，詞卡區裡已經用掉、不再顯示的片段 */
var srBankOrder = {};   /* qIdx -> 打亂過的 origIdx 陣列，每次開始測驗固定一次 */

/* ── 默寫生字：借用練字趣（apps/learn/lang/chinese/js/exam.js）同一套 HanziWriter 逐筆畫判斷
   邏輯，差別是練字趣一次只考一個字（單一 examQWriter），這裡一頁可能同時有好幾題默寫生字，
   每題各自一個獨立的 HanziWriter 實例，全部用 qIdx 當 key 區分，照抄連連看「一頁多個獨立
   SVG 元件，各自用 si 當 key」的既有模式（matchConnections[si] 那套） ── */
var dictWriters        = {}; /* qIdx -> HanziWriter 實例 */
var dictMistakes       = {}; /* qIdx -> 累計錯誤筆畫數（>3 不算通過，照抄練字趣的門檻） */
var dictStrokeMistakes = {}; /* qIdx -> 連續錯誤筆畫數（連錯3筆自動顯示輪廓提示，對了就歸零） */
var dictHintMode       = {}; /* qIdx -> 是否已經顯示過輪廓提示 */
var dictDone           = {}; /* qIdx -> 是否已經完成這一題（防止 onComplete 重複觸發） */
var dictSize            = 220; /* 寫字格固定邊長（px），不像練字趣整頁只有一個格子可以用 vw 算，
                                   這裡一頁可能很多題，固定一個適合手指/手寫筆操作的尺寸 */

/* ════════════ Utilities ════════════ */
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escJs(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

function returnToHub() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  window.parent.postMessage({ type: 'chinese-quiz-back-to-hub' }, '*');
}

function confirmBack() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  var hasInput = Object.keys(blanks).some(function(k){ return blanks[k]; }) ||
                 Object.keys(mcAnswers).length > 0 ||
                 Object.keys(matchConnections).some(function(si){ return Object.keys(matchConnections[si] || {}).length > 0; }) ||
                 Object.keys(srAnswers).some(function(k){ return (srAnswers[k] || []).some(function(v){ return v !== undefined; }); });
  if (!graded && hasInput && !confirm('作答尚未完成，確定要離開嗎？')) return;
  returnToHub();
}

function getAnswer(i) {
  var q = quizData[i];
  if (q.type === '選擇題') return mcAnswers[i];
  if (q.type === '句子重組') {
    var placed = srAnswers[i] || [];
    var complete = placed.length === (q.options || []).length && placed.every(function(v) { return v !== undefined; });
    return complete ? placed : undefined;
  }
  return blanks[i];
}

/* ════════════════════════════════════════
   Text-to-Speech
   ════════════════════════════════════════
   speakText(text)      — single string, no pause
   speakQuestion(qIdx)  — full sentence; fill-type splits at blanks
                          with 500ms silence at each gap
   ════════════════════════════════════════ */
/* iOS 內建的多語言角色語音（Eddy、Grandma…）也會回報 zh-CN/zh-TW，但不是專門的中文
   語音引擎，唸中文常咬字不清；優先挑「語音名稱本身是中文字」的語音（婷婷、美佳…）。 */
var _zhVoice = null;
function _loadZhVoice() {
  var voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;
  var zhRe = /zh|cmn|hant/i, nameRe = /[一-鿿]/;
  var candidates = voices.filter(function(v) { return zhRe.test(v.lang); });
  if (!candidates.length) return;
  var named = candidates.filter(function(v) { return nameRe.test(v.name); });
  var pool  = named.length ? named : candidates;
  var byTW  = pool.filter(function(v) { return /^zh-TW/i.test(v.lang); });
  _zhVoice  = (byTW.length ? byTW : pool)[0];
}
if (window.speechSynthesis) {
  _loadZhVoice();
  if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = _loadZhVoice;
}

function speakText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var utt  = new SpeechSynthesisUtterance(String(text).trim());
  utt.lang = 'zh-TW';
  if (_zhVoice) utt.voice = _zhVoice;
  utt.rate = 0.82;
  window.speechSynthesis.speak(utt);
}

function speakQuestion(qIdx) {
  if (!window.speechSynthesis) { showToast('此裝置不支援朗讀功能'); return; }
  window.speechSynthesis.cancel();
  var q    = quizData[qIdx];
  var text = q.question;
  /* 詞語填空：有填入答案時，把空格替換成答案後整句朗讀 */
  if (q.type === '詞語填空' && blanks[qIdx]) {
    _speak(text.replace(/[（(][^）)]*[）)]/, blanks[qIdx]), null);
    return;
  }
  var parts = text.split(/[（(][^）)]*[）)]/);   /* split at blank markers（全形或半形括號） */
  parts.length === 1 ? _speak(text, null) : _speakParts(parts, 0);
}

function _speak(text, onEnd) {
  var utt  = new SpeechSynthesisUtterance(text.trim());
  utt.lang = 'zh-TW';
  if (_zhVoice) utt.voice = _zhVoice;
  utt.rate = 0.82;
  if (onEnd) utt.onend = onEnd;
  window.speechSynthesis.speak(utt);
}

function _speakParts(parts, idx) {
  if (idx >= parts.length) return;
  var part   = parts[idx].trim();
  var isLast = idx === parts.length - 1;
  var next   = function() {
    if (!isLast) setTimeout(function(){ _speakParts(parts, idx + 1); }, 500);
  };
  part ? _speak(part, next) : next();
}

/* ════════════ Init ════════════ */

/* ════════════ Question loading ════════════ */
function loadQuestions() {
  var settings;
  try { settings = JSON.parse(sessionStorage.getItem('quiz_settings')); } catch(e) {}

  var hasIds   = settings && settings.questionIds && settings.questionIds.length;
  var hasMatch = settings && settings.matchSections && settings.matchSections.length;

  if (!settings || (!hasIds && !hasMatch && (!settings.grade || !settings.lesson))) {
    currentSession = null;
    startQuiz(FALLBACK, null, []);
    return;
  }

  currentSession = {
    sessionId:   settings.sessionId   || '',
    sessionCode: settings.sessionCode || '',
    sessionName: settings.sessionName || '',
    teacherUid:  settings.teacherUid  || ''
  };

  /* ── 固定題組 + 詞圖配對 ── */
  if (hasIds || hasMatch) {
    if (!db) { startQuiz(hasIds ? FALLBACK : [], settings, []); return; }

    var textPromise = hasIds
      ? Promise.all(settings.questionIds.map(function(id) {
          return db.collection('questions').doc(id).get();
        }))
      : Promise.resolve([]);

    var matchRaw = settings.matchSections || [];
    var matchPromise = matchRaw.length
      ? Promise.all(matchRaw.map(function(msec) {
          var wordIds = msec.wordIds || [];
          return Promise.all(wordIds.map(function(wid) {
            return db.collection('wordImages').doc(wid).get();
          })).then(function(wdocs) {
            var pairs = wordIds.map(function(wid, i) {
              var wd = wdocs[i];
              return {
                wordId:   wid,
                word:     (msec.words && msec.words[i]) || (wd.exists ? wd.data().word : ''),
                imageUrl: wd.exists ? (wd.data().imageUrl || '') : ''
              };
            });
            var indices = pairs.map(function(_, i) { return i; });
            return {
              title:     msec.title,
              points:    msec.points || '',
              pairs:     pairs,
              imgOrder:  shuffle(indices.slice()),
              wordOrder: shuffle(indices.slice())
            };
          });
        }))
      : Promise.resolve([]);

    Promise.all([textPromise, matchPromise]).then(function(results) {
      var qdocs = results[0], matchLoaded = results[1];
      var questions = [];
      qdocs.forEach(function(doc) {
        if (!doc.exists) return;
        var d = doc.data();
        /* 默寫生字的 answer 是字義，老師可能沒填，不能拿來當「題目完整」的條件；
           zhuyin／hintWord 是默寫生字的作答提示（注音＋語詞挖空），沒帶過來學生就看不到提示 */
        if (d.type && d.question && (d.answer || d.type === '默寫生字')) {
          questions.push({ id: doc.id, type: d.type, question: d.question, answer: d.answer || '',
                           options: d.options || [], grade: d.grade, lesson: d.lesson,
                           zhuyin: d.zhuyin || '', hintWord: d.hintWord || '' });
        }
      });
      if (!questions.length && !matchLoaded.length) {
        startQuiz(FALLBACK, null, []);
      } else {
        startQuiz(questions, settings, matchLoaded);
      }
    }).catch(function() { startQuiz(FALLBACK, null, []); });
    return;
  }

  if (!db) { startQuiz(FALLBACK, null); return; }

  var grade      = settings.grade;
  var lesson     = settings.lesson;
  var teacherUid = settings.teacherUid || '';

  /* 每位老師的題庫各自獨立管理，這裡只查該場測驗建立者自己的題庫。
     用 (teacherUid, grade) 對應複合索引，lesson 交給前端過濾，避免多加一個索引欄位。 */
  var queries = [];
  if (teacherUid) {
    queries.push(
      db.collection('questions').where('teacherUid', '==', teacherUid).where('grade', '==', grade).get()
    );
  }

  Promise.all(queries)
    .then(function(results) {
      var seen = {};
      var all  = [];
      results.forEach(function(snap) {
        snap.docs.forEach(function(d) {
          if (seen[d.id]) return;
          seen[d.id] = true;
          var v = d.data();
          if (v.type && v.question && v.answer && v.lesson === lesson) {
            all.push({ type: v.type, question: v.question, answer: v.answer,
                       options: v.options || [], grade: v.grade, lesson: v.lesson });
          }
        });
      });

      if (!all.length) { startQuiz(FALLBACK, null, []); return; }

      var sampled = [];
      TYPE_ORDER.forEach(function(type) {
        var n = ((settings.counts || {})[type]) || 0;
        if (!n) return;
        var pool = shuffle(all.filter(function(q){ return q.type === type; }));
        sampled = sampled.concat(pool.slice(0, n));
      });

      startQuiz(sampled.length ? sampled : FALLBACK,
                sampled.length ? settings : null, []);
    })
    .catch(function() { startQuiz(FALLBACK, null, []); });
}

/* ════════════════════════════════════════
   MC normalisation
   Old Firestore docs store options as ['A. text', ...] and answer as 'A'.
   New docs store options as plain text and answer as the correct option text.
   _normMCQuestion converts old → new so the renderer only needs one path.
   ════════════════════════════════════════ */
function _normMCQuestion(q) {
  if (q.type !== '選擇題') return q;
  var opts = (q.options || []).slice();
  var ans  = String(q.answer || '');
  /* Detect old format: answer is a single letter AND options start with 'A.'/'B.'/'C.' */
  var isOld = /^[A-C]$/i.test(ans) && opts.length > 0 && /^[A-C][.．、]/.test(opts[0] || '');
  if (!isOld) return q;
  var clean  = opts.map(function(o) { return o.replace(/^[A-C][.．、]\s*/, '').trim(); });
  var ansIdx = ans.toUpperCase().charCodeAt(0) - 65;
  return { id: q.id, type: q.type, question: q.question, answer: clean[ansIdx] || ans,
           options: clean, grade: q.grade, lesson: q.lesson };
}

function startQuiz(qs, settings, matchLoaded) {
  quizData         = qs.map(_normMCQuestion);
  matchData        = matchLoaded || [];
  blanks           = {};
  mcAnswers        = {};
  matchConnections = {};
  srAnswers        = {};
  srBankUsed       = {};
  srBankOrder      = {};
  dictWriters        = {};
  dictMistakes       = {};
  dictStrokeMistakes = {};
  dictHintMode       = {};
  dictDone           = {};
  graded           = false;
  pendingDrag      = null;
  currentSettings = settings || null;
  if (_countUpRAF) { cancelAnimationFrame(_countUpRAF); _countUpRAF = null; }

  quizData.forEach(function(q, i) {
    if (q.type !== '句子重組') return;
    srAnswers[i]   = new Array((q.options || []).length); /* 依「格子位置」索引，不是依「放入順序」——拖曳可以放到任何一格 */
    srBankUsed[i]  = {};
    srBankOrder[i] = shuffle((q.options || []).map(function(_, idx) { return idx; }));
  });

  /* Update lesson info in sheet header */
  var lessonEl = document.getElementById('sheet-lesson');
  if (lessonEl) {
    if (settings && settings.grade && settings.lesson) {
      var label = settings.grade + '　第' + settings.lesson + '課';
      if (settings.lessonName && settings.lessonName !== settings.lesson)
        label += '　' + settings.lessonName;
      lessonEl.textContent = label;
    } else {
      lessonEl.textContent = '';
    }
  }

  ['fill', 'explain'].forEach(function(pk) {
    var typeKey = pk === 'fill' ? '詞語填空' : '詞語解釋';
    poolOrder[pk] = shuffle(
      quizData.filter(function(q){ return q.type === typeKey; })
              .map(function(q){ return q.answer; })
    );
  });

  document.getElementById('loading-msg').style.display = 'none';
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('btn-submit').disabled = false;
  document.getElementById('quiz-screen').style.display = '';

  renderSections();
  renderAll();
  initDictWriters(); /* 只跑這一次——不要放進 renderAll()，renderAll 會被其他題型的拖曳互動
                         反覆呼叫，放進去的話每次都會把寫到一半的 HanziWriter 砍掉重建 */
}

/* ════════════ Rendering — sections ════════════ */
/* 大題順序：老師在出卷精靈 Step 3 拖曳調整過的順序會存成 session 的 sectionOrder，
   照它排；沒有存（舊測驗、隨機抽題）或沒列到的題型，接在後面照 TYPE_ORDER 預設順序 */
function _sectionTypeOrder() {
  var saved = (currentSettings && currentSettings.sectionOrder) || [];
  var order = saved.filter(function(t) { return TYPE_ORDER.indexOf(t) >= 0; });
  TYPE_ORDER.forEach(function(t) { if (order.indexOf(t) < 0) order.push(t); });
  return order;
}

function renderSections() {
  var html = '';
  var sn   = 0;

  _sectionTypeOrder().forEach(function(type) {
    var qs = quizData.filter(function(q){ return q.type === type; });
    if (!qs.length) return;
    var pk = POOL_KEY[type];

    html += '<div class="q-section">' +
      '<div class="section-header">' +
        '<span class="section-num">'  + SECTION_NUMS[sn] + '、</span>' +
        '<span class="section-type">' + escHtml(type)    + '</span>' +
      '</div>';

    if (pk) {
      html += '<div class="pool-area">' +
        '<div class="pool-label">答案池　請將詞卡拖曳至各題空格中</div>' +
        '<div class="pool-words" id="pool-' + pk + '"></div>' +
      '</div>';
    }

    html += '<div class="q-list">';
    qs.forEach(function(q, j) { html += renderQuestion(q, quizData.indexOf(q), j + 1); });
    html += '</div></div>';
    sn++;
  });

  html += '<div id="match-sections-container"></div>';
  document.getElementById('sections-container').innerHTML = html;
  renderMatchSections();
}

/* ════════════ Match section rendering ════════════ */
function _textSectionCount() {
  return _sectionTypeOrder().filter(function(t) {
    return quizData.some(function(q) { return q.type === t; });
  }).length;
}

function renderMatchSections() {
  var el = document.getElementById('match-sections-container');
  if (!el) return;
  el.innerHTML = matchData.map(function(_, si) { return renderMatchSection(si); }).join('');
  requestAnimationFrame(updateAllMatchSvg);
}

function renderMatchSection(si) {
  var msec   = matchData[si];
  if (!msec) return '';
  var n      = msec.pairs.length;
  var secNum = SECTION_NUMS[_textSectionCount() + si] || String(_textSectionCount() + si + 1);
  var imgSz  = n <= 4 ? 135 : n <= 6 ? 114 : 93;
  var conns  = matchConnections[si] || {};

  var leftHtml = (msec.imgOrder || []).map(function(pairIdx, imgPos) {
    var pair = msec.pairs[pairIdx];
    var gradeClass = '';
    if (graded) {
      var wp      = conns[imgPos];
      var isRight = wp !== undefined && msec.wordOrder[wp] === pairIdx;
      gradeClass  = isRight ? ' graded-correct' : ' graded-wrong';
    }
    return '<div class="match-item match-item-img' + gradeClass + '" data-si="' + si +
        '" data-side="img" data-pos="' + imgPos + '">' +
      '<img class="match-img" src="' + escHtml(pair.imageUrl || '') + '" alt=""' +
        ' style="width:' + imgSz + 'px;height:' + imgSz + 'px">' +
      (!graded ? '<div class="match-ep match-ep-right"></div>' : '') +
    '</div>';
  }).join('');

  var rightHtml = (msec.wordOrder || []).map(function(pairIdx, wordPos) {
    var pair = msec.pairs[pairIdx];
    var gradeClass = '';
    if (graded) {
      var connImgPos = null;
      Object.keys(conns).forEach(function(ip) {
        if (parseInt(conns[ip]) === wordPos) connImgPos = parseInt(ip);
      });
      var isRight = connImgPos !== null && msec.imgOrder[connImgPos] === pairIdx;
      gradeClass  = isRight ? ' graded-correct' : ' graded-wrong';
    }
    return '<div class="match-item match-item-word' + gradeClass + '" data-si="' + si +
        '" data-side="word" data-pos="' + wordPos + '">' +
      (!graded ? '<div class="match-ep match-ep-left"></div>' : '') +
      '<span class="match-word-label">' + escHtml(pair.word) + '</span>' +
    '</div>';
  }).join('');

  return '<div class="q-section">' +
    '<div class="section-header">' +
      '<span class="section-num">'  + escHtml(secNum)     + '、</span>' +
      '<span class="section-type">' + escHtml(msec.title) + '</span>' +
    '</div>' +
    '<p class="match-hint">請拖曳連接圖片與對應的詞語</p>' +
    '<div class="match-connect-wrap" id="match-wrap-' + si + '">' +
      '<div class="match-col-left" style="flex:0 0 auto;width:' + (imgSz + 8) + 'px">'  + leftHtml  + '</div>' +
      '<svg class="match-svg" id="match-svg-' + si + '" pointer-events="none"></svg>' +
      '<div class="match-col-right">' + rightHtml + '</div>' +
    '</div>' +
  '</div>';
}

/* ── SVG connector helpers ── */

function _epCenter(si, side, pos) {
  var cls  = side === 'img' ? '.match-ep-right' : '.match-ep-left';
  var ep   = document.querySelector(
    '.match-item[data-si="' + si + '"][data-side="' + side + '"][data-pos="' + pos + '"] ' + cls);
  var wrap = document.getElementById('match-wrap-' + si);
  if (!ep || !wrap) return null;
  var er = ep.getBoundingClientRect();
  var wr = wrap.getBoundingClientRect();
  return { x: er.left + er.width / 2 - wr.left, y: er.top + er.height / 2 - wr.top };
}

function updateMatchSvg(si, rubberband) {
  var svgEl = document.getElementById('match-svg-' + si);
  var msec  = matchData[si];
  if (!svgEl || !msec) return;
  var conns = matchConnections[si] || {};
  var out   = '';

  Object.keys(conns).forEach(function(ipStr) {
    var imgPos  = parseInt(ipStr);
    var wordPos = conns[imgPos];
    var p1 = _epCenter(si, 'img',  imgPos);
    var p2 = _epCenter(si, 'word', wordPos);
    if (!p1 || !p2) return;

    var pairIdx = msec.imgOrder[imgPos];
    var isRight = msec.wordOrder[wordPos] === pairIdx;
    var color   = !graded ? 'var(--accent)' : (isRight ? 'var(--correct)' : 'var(--wrong)');

    out += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p2.x + '" y2="' + p2.y +
      '" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round"></line>';

    if (!graded) {
      /* wide transparent hit-area for click-to-disconnect */
      out += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p2.x + '" y2="' + p2.y +
        '" stroke="transparent" stroke-width="20" pointer-events="stroke"' +
        ' style="cursor:pointer" onclick="disconnectMatch(' + si + ',' + imgPos + ')"></line>';
    }

    if (graded && !isRight) {
      /* dashed hint line to the correct word */
      var correctWPos = null;
      (msec.wordOrder || []).forEach(function(wpi, wp) {
        if (wpi === pairIdx) correctWPos = wp;
      });
      if (correctWPos !== null) {
        var p3 = _epCenter(si, 'word', correctWPos);
        if (p3) out += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p3.x + '" y2="' + p3.y +
          '" stroke="var(--correct)" stroke-width="1.5" stroke-dasharray="6,4"' +
          ' stroke-linecap="round" opacity="0.7"></line>';
      }
    }
  });

  if (graded) {
    /* dashed hint for unconnected images */
    (msec.imgOrder || []).forEach(function(pairIdx, imgPos) {
      if (conns[imgPos] !== undefined) return;
      var p1 = _epCenter(si, 'img', imgPos);
      var correctWPos = null;
      (msec.wordOrder || []).forEach(function(wpi, wp) { if (wpi === pairIdx) correctWPos = wp; });
      if (!p1 || correctWPos === null) return;
      var p3 = _epCenter(si, 'word', correctWPos);
      if (p3) out += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p3.x + '" y2="' + p3.y +
        '" stroke="var(--correct)" stroke-width="1.5" stroke-dasharray="6,4"' +
        ' stroke-linecap="round" opacity="0.7"></line>';
    });
  }

  if (rubberband) {
    out += '<line x1="' + rubberband.x1 + '" y1="' + rubberband.y1 +
      '" x2="' + rubberband.x2 + '" y2="' + rubberband.y2 +
      '" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8,4"' +
      ' stroke-linecap="round" opacity="0.75"></line>';
  }

  svgEl.innerHTML = out;
}

function updateAllMatchSvg() {
  matchData.forEach(function(_, si) { updateMatchSvg(si); });
}

function disconnectMatch(si, imgPos) {
  if (graded) return;
  if (!matchConnections[si]) return;
  delete matchConnections[si][imgPos];
  updateMatchSvg(si);
}

function doConnect(si, imgPos, wordPos) {
  if (!matchConnections[si]) matchConnections[si] = {};
  var conns = matchConnections[si];
  delete conns[imgPos];
  Object.keys(conns).forEach(function(ip) { if (conns[ip] === wordPos) delete conns[ip]; });
  conns[imgPos] = wordPos;
  updateMatchSvg(si);
}

function findMatchEndpointAt(x, y, si, side) {
  var best = null, bestDist = Infinity, TOL = 56;
  document.querySelectorAll('.match-item[data-si="' + si + '"][data-side="' + side + '"]')
    .forEach(function(el) {
      var r = el.getBoundingClientRect();
      if (x < r.left - TOL || x > r.right  + TOL ||
          y < r.top  - TOL || y > r.bottom + TOL) return;
      var dist = Math.sqrt(Math.pow(x - (r.left + r.width  / 2), 2) +
                           Math.pow(y - (r.top  + r.height / 2), 2));
      if (dist < bestDist) { bestDist = dist; best = parseInt(el.dataset.pos); }
    });
  return best;
}

function renderQuestion(q, qIdx, num) {
  if (q.type === '選擇題')  return renderMC(q, qIdx, num);
  if (q.type === '詞語填空') return renderFill(q, qIdx, num);
  if (q.type === '句子重組') return renderSentenceReorder(q, qIdx, num);
  if (q.type === '默寫生字') return renderDictation(q, qIdx, num);
  return renderExplain(q, qIdx, num);
}

/* 默寫生字：渲染只搭骨架（注音/語詞提示＋一個空的寫字格容器），跟句子重組同一個道理——
   HanziWriter 需要容器已經在真實 DOM 裡、量得到實際寬度才能建立，實際建立的動作要等
   innerHTML 真的插入頁面之後才能做（在 initDictWriters() 裡，startQuiz() 呼叫一次） */
function renderDictation(q, qIdx, num) {
  var blanked = q.hintWord ? q.hintWord.split(q.question).join('（　）') : '';
  return '<div class="q-row dict-row" id="qr-' + qIdx + '">' +
    '<div class="dict-head">' +
      '<span class="q-num">' + num + '.</span>' +
      '<span class="dict-prompt">' +
        (q.zhuyin ? '<span class="dict-zhuyin-badge">' + escHtml(q.zhuyin) + '</span>' : '') +
        (blanked ? '<span class="dict-word-hint">' + escHtml(blanked) + '</span>' : '') +
      '</span>' +
      '<button type="button" class="dict-voice-btn" onclick="speakText(\'' + escJs(q.question) + '\')" ' +
        'title="聽聽看這個字怎麼唸">🔊 聽字音</button>' +
    '</div>' +
    '<div class="dict-writer-box" id="dict-writer-' + qIdx + '"></div>' +
    '<div class="dict-status" id="dict-status-' + qIdx + '">請照筆順把字寫在格子裡</div>' +
  '</div>';
}

/* 句子重組：詞卡池拖曳到格子裡（沿用既有的拖曳機制，跟填空/解釋同一套 pointer 事件），
   格子裡的字也可以再拖到別格調整順序，或拖出格子退回詞卡池。渲染只搭骨架，實際內容由
   renderSrPieces()（跟 renderPools/renderBlanks 同一套呼叫時機，在 renderAll() 裡）填進去。 */
function renderSentenceReorder(q, qIdx, num) {
  return '<div class="q-row sr-row" id="qr-' + qIdx + '">' +
    '<div class="sr-head">' +
      '<span class="q-num">' + num + '.</span>' +
      '<button type="button" class="sr-listen-btn" onclick="srSpeakAssembled(' + qIdx + ')" ' +
        'title="聽聽看目前排的句子通不通順">🔊 聽聽看</button>' +
    '</div>' +
    '<div class="sr-wrap">' +
      '<div class="sr-slots" id="sr-slots-' + qIdx + '"></div>' +
      '<div class="sr-bank"  id="sr-bank-'  + qIdx + '"></div>' +
    '</div>' +
  '</div>';
}

/* 把目前排在格子裡的字（不管排滿了沒）接起來唸一次，給學生自己檢查通不通順用 */
function srSpeakAssembled(qIdx) {
  var q = quizData[qIdx];
  if (!q) return;
  var placed = srAnswers[qIdx] || [];
  var text = placed.map(function(oi) { return oi !== undefined ? q.options[oi] : ''; }).join('');
  if (!text) { showToast('還沒排任何字喔'); return; }
  speakText(text);
}

/* ════════════ 默寫生字：HanziWriter 逐字初始化／判斷 ════════════
   跟練字趣 exam.js 同一套邏輯（makeWriterOpts/showExamQuestion/startExamQQuiz 的翻版），
   差別只在這裡一頁可能同時有好幾個字要考，所以每個實例、每個計數器都要用 qIdx 當 key，
   不能像練字趣那樣整頁只有一個 examQWriter 共用。 */

function _dictWriterOpts(sz, overrides) {
  return Object.assign({
    width: sz, height: sz, padding: Math.round(sz * 0.07),
    strokeColor: '#2d6fa8', outlineColor: '#c8dff5',
    drawingColor: '#2d6fa8', drawingWidth: Math.max(4, Math.round(sz * 0.013)),
    highlightColor: '#ffd54f', showCharacter: false, showOutline: true, leniency: 1.2
  }, overrides || {});
}

/* startQuiz() 呼叫一次（不是放進 renderAll()）——quizData 裡每一題默寫生字各自建一個
   HanziWriter 實例，容器用 dict-writer-<qIdx> 的 id 找，已經建過的不重建（dictWriters[i] 存在
   就跳過），避免 renderAll() 之後哪天不小心被重複呼叫到時把寫一半的字砍掉重建 */
function initDictWriters() {
  quizData.forEach(function(q, i) {
    if (q.type !== '默寫生字' || dictWriters[i]) return;
    var container = document.getElementById('dict-writer-' + i);
    if (!container) return;
    requestAnimationFrame(function() {
      var sz = container.getBoundingClientRect().width || dictSize;
      /* showOutline:false——這是考試，一開始絕不能露出字的輪廓（共用預設是練習用的 true，
         直接沿用等於把答案印在格子裡）；連錯 3 筆才由 startDictQuiz 呼叫 showOutline() 給提示，
         跟練字趣 exam.js 同一個做法 */
      dictWriters[i] = HanziWriter.create('dict-writer-' + i, q.question, _dictWriterOpts(sz, {
        showOutline: false,
        onLoadCharDataSuccess: function() { startDictQuiz(i, q.question, sz); },
        onLoadCharDataError: function() {
          var s = document.getElementById('dict-status-' + i);
          if (s) s.textContent = '筆順資料載入失敗，請確認網路連線後重新整理';
        }
      }));
    });
  });
}

function flashDictBox(qIdx, color) {
  var el = document.getElementById('dict-writer-' + qIdx);
  if (!el) return;
  el.classList.remove('dict-flash-green', 'dict-flash-red');
  void el.offsetWidth; /* 強制 reflow，讓同一個顏色可以連續閃第二次 */
  el.classList.add(color === 'green' ? 'dict-flash-green' : 'dict-flash-red');
}

/* 同一筆連錯3次的提示交給 HanziWriter 內建的 showHintAfterMisses（預設3）——只用黃色標出
   「下一筆」，不能呼叫 showOutline()：那會把整個字的輪廓攤開，等於直接給答案（exam.js 呼叫
   showOutline 沒事是因為它的 outlineColor 是透明的，這裡是淺藍色）。累計錯到6筆，
   整個重建一個「看著輪廓描字」模式的新實例（leniency 放寬、提示更早出現），這題直接算
   沒通過（跟 exam.js 的 EXAM_FAIL_MISTAKES=99 同樣精神，描完就收，不會真的卡住寫不完） */
function startDictQuiz(qIdx, char, sz) {
  var w = dictWriters[qIdx];
  if (!w) return;
  dictMistakes[qIdx] = 0; dictStrokeMistakes[qIdx] = 0; dictHintMode[qIdx] = false;
  w.quiz({
    onMistake: function() {
      dictMistakes[qIdx]++; dictStrokeMistakes[qIdx]++;
      flashDictBox(qIdx, 'red');
      if (dictMistakes[qIdx] >= 6 && !dictDone[qIdx]) {
        var target = document.getElementById('dict-writer-' + qIdx);
        if (target) { while (target.firstChild) target.removeChild(target.firstChild); }
        var s = document.getElementById('dict-status-' + qIdx);
        if (s) s.textContent = '看著輪廓把字描完吧！';
        dictWriters[qIdx] = HanziWriter.create('dict-writer-' + qIdx, char, _dictWriterOpts(sz, {
          padding: Math.round(sz * 0.08), showCharacter: true, leniency: 1.5,
          onLoadCharDataSuccess: function() {
            dictWriters[qIdx].quiz({
              showHintAfterMisses: 1, markStrokeCorrectAfterMisses: 3, leniency: 1.5,
              onMistake: function() {},
              onCorrectStroke: function() { flashDictBox(qIdx, 'green'); },
              onComplete: function() { finishDictQuiz(qIdx, true); }
            });
          }
        }));
      }
    },
    onCorrectStroke: function() {
      dictStrokeMistakes[qIdx] = 0;
      flashDictBox(qIdx, 'green');
    },
    onComplete: function() { finishDictQuiz(qIdx, false); }
  });
}

/* HanziWriter 的 onComplete 偶爾會重複觸發（練字趣 practice.js 也特地擋過這個），
   用 dictDone 擋第二次；forcedTrace=true 代表是用「描字」模式完成的，算沒通過
   （比照 exam.js：這種情況最後記錄的 mistakes 是保證超過門檻的數字，不是真的筆畫數） */
function finishDictQuiz(qIdx, forcedTrace) {
  if (dictDone[qIdx]) return;
  dictDone[qIdx] = true;
  if (forcedTrace) dictMistakes[qIdx] = 99;
  var s = document.getElementById('dict-status-' + qIdx);
  if (s) s.textContent = forcedTrace ? '已完成（描字）' : (dictMistakes[qIdx] <= 3 ? '✓ 寫對了！' : '完成，可以再練習這個字');
}

/* Click anywhere on the question text → speaks the full sentence */
function renderFill(q, qIdx, num) {
  var blankSpan = '<span class="q-blank blank-placeholder" id="blank-' + qIdx +
    '" data-qidx="' + qIdx + '"></span>';
  var textHtml = escHtml(q.question).replace(/[（(][^）)]*[）)]/, blankSpan);
  return '<div class="q-row" id="qr-' + qIdx + '">' +
    '<span class="q-num">' + num + '.</span>' +
    '<div class="q-text-wrap q-speakable" onclick="speakQuestion(' + qIdx + ')">' +
      textHtml +
    '</div>' +
  '</div>';
}

function renderExplain(q, qIdx, num) {
  return '<div class="q-row" id="qr-' + qIdx + '">' +
    '<span class="q-num">' + num + '.</span>' +
    '<div class="q-text-wrap q-speakable" onclick="speakQuestion(' + qIdx + ')">' +
      '<span class="q-def-text">' + escHtml(q.question) + '</span>' +
      '<span class="q-blank blank-placeholder" id="blank-' + qIdx +
        '" data-qidx="' + qIdx + '"></span>' +
    '</div>' +
  '</div>';
}

/* Click question text → speaks question; click option → selects + speaks option text only */
function renderMC(q, qIdx, num) {
  var LABELS  = ['A', 'B', 'C', 'D'];  /* positions after shuffle */
  var shuffled = shuffle((q.options || []).slice());
  var opts = shuffled.map(function(text, pos) {
    var label = LABELS[pos] || String(pos + 1);
    return '<button class="opt-btn" id="opt-' + qIdx + '-' + label + '"' +
      ' data-opt-text="' + escHtml(text) + '"' +
      ' onclick="selectOption(' + qIdx + ',\'' + escJs(text) + '\')">' +
      escHtml(label + '. ' + text) +
      '</button>';
  }).join('');
  return '<div class="q-block" id="qb-' + qIdx + '">' +
    '<div class="q-header">' +
      '<div class="q-num">' + num + '</div>' +
      '<div class="q-result-icon" id="icon-' + qIdx + '"></div>' +
    '</div>' +
    '<div class="q-text q-speakable" onclick="speakQuestion(' + qIdx + ')">' +
      escHtml(q.question) +
    '</div>' +
    '<div class="q-options">' + opts + '</div>' +
    '<div class="q-answer-hint" id="hint-' + qIdx + '"></div>' +
  '</div>';
}

/* ════════════ Live rendering ════════════ */
function renderAll() {
  if (graded) return;
  renderPools();
  renderBlanks();
  renderSrPieces();
  renderMatchSections();
}

/* ════════════ 句子重組互動（拖曳，沿用詞語池同一套 pointer 拖曳機制）════════════
   srAnswers[qIdx] 是依「格子位置」索引的陣列（不是依「放入順序」）——拖到哪一格就佔哪一格，
   可以跳著放、可以把已經放的字再拖到別格互換，也可以拖出格子外退回詞卡池。 */
function renderSrPieces() {
  quizData.forEach(function(q, i) {
    if (q.type !== '句子重組') return;
    var slotsEl = document.getElementById('sr-slots-' + i);
    var bankEl  = document.getElementById('sr-bank-'  + i);
    if (!slotsEl || !bankEl) return;
    var placed = srAnswers[i] || [];
    var total  = (q.options || []).length;
    var isDraggingHere = dragging && dragging.dragKind === 'sr' && dragging.qIdx === i;

    var slotsHtml = '';
    for (var pos = 0; pos < total; pos++) {
      var origIdx = placed[pos];
      var hide = isDraggingHere && dragging.fromPos === pos; /* 正在把這一格的字拖走，拖曳途中先讓格子看起來是空的 */
      if (origIdx !== undefined && !hide) {
        slotsHtml += '<div class="sr-slot sr-slot-filled" data-qidx="' + i + '" data-pos="' + pos + '">' +
          escHtml(q.options[origIdx]) + '</div>';
      } else {
        slotsHtml += '<div class="sr-slot sr-slot-empty" data-qidx="' + i + '" data-pos="' + pos + '"></div>';
      }
    }
    slotsEl.innerHTML = slotsHtml;

    var order = srBankOrder[i] || [];
    var used  = srBankUsed[i]  || {};
    var hideBankOrigIdx = (isDraggingHere && dragging.fromPos === null) ? dragging.origIdx : null;
    var bankHtml = order.filter(function(origIdx) {
      return !used[origIdx] && origIdx !== hideBankOrigIdx;
    }).map(function(origIdx) {
      return '<button class="sr-piece" data-qidx="' + i + '" data-origidx="' + origIdx + '">' +
        escHtml(q.options[origIdx]) + '</button>';
    }).join('');
    bankEl.innerHTML = bankHtml || '<span class="pool-empty">（詞卡已全部放入）</span>';
  });
}

/* 把 origIdx 這個片段放進 qIdx 題的 toPos 格：
   - fromPos 是 null：從詞卡池拖過來的；如果目標格已經有別的字，那個字要退回詞卡池
   - fromPos 有值：從另一格拖過來的（互換）；原本那格變成被擠出來的那個字（目標格本來是空的，原本那格就跟著變空） */
function srDoPlace(qIdx, origIdx, fromPos, toPos) {
  var arr = srAnswers[qIdx];
  if (!arr) return;
  var displaced = arr[toPos];
  if (fromPos !== null) {
    arr[fromPos] = displaced;
  } else if (displaced !== undefined) {
    srBankUsed[qIdx][displaced] = false;
  }
  arr[toPos] = origIdx;
  srBankUsed[qIdx][origIdx] = true;
  renderSrPieces();
  speakText(quizData[qIdx].options[origIdx]);
}

/* 拖出格子外、沒放到任何格子上：退回詞卡池 */
function srRemovePiece(qIdx, pos) {
  var arr = srAnswers[qIdx];
  if (!arr) return;
  var origIdx = arr[pos];
  if (origIdx === undefined) return;
  arr[pos] = undefined;
  srBankUsed[qIdx][origIdx] = false;
}

function findDropSrSlot(x, y, info) {
  var best = null, bestDist = Infinity;
  document.querySelectorAll('.sr-slot').forEach(function(el) {
    if (parseInt(el.dataset.qidx) !== info.qIdx) return; /* 句子重組只能在同一題內部移動，不能跨題 */
    var r = el.getBoundingClientRect();
    if (x < r.left - DROP_TOL || x > r.right  + DROP_TOL ||
        y < r.top  - DROP_TOL || y > r.bottom + DROP_TOL) return;
    var dist = Math.sqrt(Math.pow(x - (r.left + r.width/2), 2) + Math.pow(y - (r.top + r.height/2), 2));
    if (dist < bestDist) { bestDist = dist; best = el; }
  });
  return best;
}

function renderPools() {
  ['fill', 'explain'].forEach(function(pk) {
    var el = document.getElementById('pool-' + pk);
    if (!el) return;
    var typeKey = pk === 'fill' ? '詞語填空' : '詞語解釋';
    var placed  = {};
    quizData.forEach(function(q, i) {
      if (q.type === typeKey && blanks[i]) placed[blanks[i]] = true;
    });
    var fromPool = (dragging && dragging.poolKey === pk && dragging.fromQIdx === null)
      ? dragging.word : null;
    var visible = (poolOrder[pk] || []).filter(function(w) {
      return !placed[w] && w !== fromPool;
    });
    el.innerHTML = visible.length
      ? visible.map(function(w) {
          return '<div class="pool-word" data-word="' + escHtml(w) +
            '" data-pool="' + pk + '">' + escHtml(w) + '</div>';
        }).join('')
      : '<span class="pool-empty">（詞卡已全部填入）</span>';
  });
}

function renderBlanks() {
  quizData.forEach(function(q, i) {
    if (q.type === '選擇題') return;
    var el = document.getElementById('blank-' + i);
    if (!el) return;
    var isDraggingFrom = dragging && dragging.fromQIdx === i;
    var word = isDraggingFrom ? null : blanks[i];
    if (word) {
      el.innerHTML = escHtml(word) +
        '<button class="blank-remove" ' +
          'onpointerdown="event.stopPropagation()" ' +
          'onclick="event.stopPropagation();removeBlankWord(' + i + ')" ' +
          'title="移除">×</button>';
      el.classList.add('filled');
      el.classList.remove('blank-placeholder', 'drag-over');
    } else {
      el.innerHTML = '';
      el.classList.remove('filled', 'drag-over');
      el.classList.add('blank-placeholder');
    }
  });
}

/* ════════════ Remove word from blank ════════════ */
function removeBlankWord(qIdx) {
  if (graded) return;
  blanks[qIdx] = undefined;
  renderAll();
}

/* ════════════ MC interaction ════════════
   Clicking an option: selects it + speaks its text.
   Works even after grading (speaks, but doesn't change selection).
   ════════════════════════════════════════ */
function selectOption(qIdx, text) {
  /* Speak only the option text — no label prefix */
  speakText(text);
  if (graded) return;
  /* Toggle selected class: mark only the button whose data-opt-text matches */
  document.querySelectorAll('#qb-' + qIdx + ' .opt-btn').forEach(function(b) {
    b.classList.toggle('selected', b.dataset.optText === text);
  });
  mcAnswers[qIdx] = text;
}

/* ════════════════════════════════════════
   Pointer interaction — tap vs drag
   ════════════════════════════════════════
   Pool words and filled blanks use a movement threshold:
   • Small movement (< DRAG_THOLD px) → tap → speakText(word)
   • Large movement (≥ DRAG_THOLD px) → drag → startDrag()

   Question text areas use plain onclick (no conflict because
   e.preventDefault() on the blank/pool pointerdown suppresses
   the synthetic click event on ancestor elements).
   ════════════════════════════════════════ */
function onDelegatedPointerDown(e) {
  if (dragging) return;

  /* Pool word */
  var card = e.target.closest('.pool-word');
  if (card) {
    e.preventDefault(); /* suppress click on ancestors */
    pendingDrag = { dragKind: 'text', word: card.dataset.word, poolKey: card.dataset.pool,
                    fromQIdx: null, sx: e.clientX, sy: e.clientY };
    _addPendingListeners();
    return;
  }

  /* Filled blank (drag or tap to hear) */
  var blank = e.target.closest('.q-blank');
  if (blank && blank.classList.contains('filled') && !graded) {
    var qIdx = parseInt(blank.dataset.qidx);
    var word = blanks[qIdx];
    if (!word) return;
    e.preventDefault();
    pendingDrag = { dragKind: 'text', word: word, poolKey: POOL_KEY[quizData[qIdx].type],
                    fromQIdx: qIdx, sx: e.clientX, sy: e.clientY };
    _addPendingListeners();
    return;
  }

  /* 句子重組：詞卡池裡的片段 */
  var srPiece = e.target.closest('.sr-piece');
  if (srPiece && !graded) {
    e.preventDefault();
    pendingDrag = { dragKind: 'sr', qIdx: parseInt(srPiece.dataset.qidx), origIdx: parseInt(srPiece.dataset.origidx),
                    fromPos: null, word: srPiece.textContent, sx: e.clientX, sy: e.clientY };
    _addPendingListeners();
    return;
  }

  /* 句子重組：已經放進格子裡的片段（可以拖到別格調整順序，或單純點一下聽發音） */
  var srSlot = e.target.closest('.sr-slot-filled');
  if (srSlot && !graded) {
    var srQIdx = parseInt(srSlot.dataset.qidx);
    var srPos  = parseInt(srSlot.dataset.pos);
    var srOrigIdx = (srAnswers[srQIdx] || [])[srPos];
    if (srOrigIdx === undefined) return;
    e.preventDefault();
    pendingDrag = { dragKind: 'sr', qIdx: srQIdx, origIdx: srOrigIdx, fromPos: srPos,
                    word: quizData[srQIdx].options[srOrigIdx], sx: e.clientX, sy: e.clientY };
    _addPendingListeners();
    return;
  }

  /* Match item — start rubber-band connection drag */
  var matchItem = e.target.closest('.match-item');
  if (matchItem && !graded) {
    var msi  = parseInt(matchItem.dataset.si);
    var side = matchItem.dataset.side;
    var pos  = parseInt(matchItem.dataset.pos);
    e.preventDefault();
    /* disconnect existing connection from this endpoint so a new one can start */
    if (!matchConnections[msi]) matchConnections[msi] = {};
    if (side === 'img') {
      delete matchConnections[msi][pos];
    } else {
      Object.keys(matchConnections[msi]).forEach(function(ip) {
        if (matchConnections[msi][ip] === pos) delete matchConnections[msi][ip];
      });
    }
    updateMatchSvg(msi);
    pendingDrag = { dragKind: 'match-connect', si: msi, side: side, pos: pos,
                    sx: e.clientX, sy: e.clientY };
    _addPendingListeners();
    return;
  }
}

function _addPendingListeners() {
  document.addEventListener('pointermove',   _onPendingMove,   { passive: false });
  document.addEventListener('pointerup',     _onPendingUp);
  document.addEventListener('pointercancel', _onPendingCancel);
}

function _removePendingListeners() {
  document.removeEventListener('pointermove',   _onPendingMove);
  document.removeEventListener('pointerup',     _onPendingUp);
  document.removeEventListener('pointercancel', _onPendingCancel);
}

function _onPendingMove(e) {
  if (!pendingDrag) return;
  e.preventDefault();
  var dx = e.clientX - pendingDrag.sx;
  var dy = e.clientY - pendingDrag.sy;
  if (Math.sqrt(dx * dx + dy * dy) >= DRAG_THOLD) {
    var p = pendingDrag;
    pendingDrag = null;
    _removePendingListeners();
    startDrag(e, p);
  }
}

function _onPendingUp() {
  if (!pendingDrag) return;
  var p = pendingDrag;
  pendingDrag = null;
  _removePendingListeners();
  if (p.dragKind === 'match-connect') {
    /* Tap on word side → speak the word */
    if (p.side === 'word') {
      var msec = matchData[p.si];
      if (msec) speakText(msec.pairs[msec.wordOrder[p.pos]].word);
    }
    return;
  }
  /* Tap (small movement) → speak the word */
  speakText(p.word);
}

function _onPendingCancel() {
  pendingDrag = null;
  _removePendingListeners();
}

/* ════════════ Drag — core ════════════ */
function startDrag(e, p) {
  var ghost = null;
  if (p.dragKind !== 'match-connect') {
    ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.textContent = p.word;
    document.body.appendChild(ghost);
    posGhost(ghost, e.clientX, e.clientY);
  }

  _dragY   = e.clientY;
  dragging = Object.assign({}, p, { ghost: ghost });
  if (p.dragKind !== 'match-connect') renderAll();

  document.addEventListener('pointermove',   onDragMove,   { passive: false });
  document.addEventListener('pointerup',     onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
  _scrollRAF = requestAnimationFrame(_scrollLoop);
}

function posGhost(g, x, y) {
  g.style.left = (x - 32) + 'px';
  g.style.top  = (y - 38) + 'px';
}

/* Auto-scroll: runs every animation frame while dragging.
   Scrolls the page when the ghost is within ZONE px of the viewport edge. */
function _scrollLoop() {
  if (!dragging) { _scrollRAF = null; return; }
  var vh   = window.innerHeight;
  var ZONE = 80, MAX_SPD = 14;
  var spd  = 0;
  if      (_dragY < ZONE)       spd = -Math.ceil(MAX_SPD * (1 - _dragY / ZONE));
  else if (_dragY > vh - ZONE)  spd =  Math.ceil(MAX_SPD * (1 - (vh - _dragY) / ZONE));
  if (spd) window.scrollBy(0, spd);
  _scrollRAF = requestAnimationFrame(_scrollLoop);
}

function onDragMove(e) {
  e.preventDefault();
  if (!dragging) return;
  _dragY = e.clientY;

  if (dragging.dragKind === 'match-connect') {
    var si   = dragging.si;
    var wrap = document.getElementById('match-wrap-' + si);
    if (!wrap) return;
    var p1 = _epCenter(si, dragging.side, dragging.pos);
    if (!p1) return;
    var wr = wrap.getBoundingClientRect();
    var rb = { x1: p1.x, y1: p1.y, x2: e.clientX - wr.left, y2: e.clientY - wr.top };
    /* highlight nearest opposite-side endpoint */
    document.querySelectorAll('.match-ep').forEach(function(ep) { ep.classList.remove('match-ep-hover'); });
    var oppSide   = dragging.side === 'img' ? 'word' : 'img';
    var targetPos = findMatchEndpointAt(e.clientX, e.clientY, si, oppSide);
    if (targetPos !== null) {
      var epCls = oppSide === 'img' ? '.match-ep-right' : '.match-ep-left';
      var tep   = document.querySelector(
        '.match-item[data-si="' + si + '"][data-side="' + oppSide + '"][data-pos="' + targetPos + '"] ' + epCls);
      if (tep) tep.classList.add('match-ep-hover');
    }
    updateMatchSvg(si, rb);
    return;
  }

  if (dragging.dragKind === 'sr') {
    posGhost(dragging.ghost, e.clientX, e.clientY);
    document.querySelectorAll('.sr-slot').forEach(function(s){ s.classList.remove('drag-over'); });
    var ts = findDropSrSlot(e.clientX, e.clientY, dragging);
    if (ts) ts.classList.add('drag-over');
    return;
  }

  posGhost(dragging.ghost, e.clientX, e.clientY);
  document.querySelectorAll('.q-blank').forEach(function(b){ b.classList.remove('drag-over'); });
  var t = findDropBlank(e.clientX, e.clientY, dragging);
  if (t) t.classList.add('drag-over');
}

function onDragEnd(e) {
  document.removeEventListener('pointermove',   onDragMove);
  document.removeEventListener('pointerup',     onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);
  if (_scrollRAF) { cancelAnimationFrame(_scrollRAF); _scrollRAF = null; }
  if (!dragging) return;
  var info = dragging;
  dragging = null;
  document.querySelectorAll('.match-ep').forEach(function(ep) { ep.classList.remove('match-ep-hover'); });

  if (info.dragKind === 'match-connect') {
    var si      = info.si;
    var oppSide = info.side === 'img' ? 'word' : 'img';
    var tPos    = findMatchEndpointAt(e.clientX || 0, e.clientY || 0, si, oppSide);
    if (tPos !== null) {
      var imgPos  = info.side === 'img' ? info.pos : tPos;
      var wordPos = info.side === 'img' ? tPos : info.pos;
      doConnect(si, imgPos, wordPos);
    } else {
      updateMatchSvg(si); /* clear rubber-band */
    }
    return;
  }

  if (info.dragKind === 'sr') {
    document.querySelectorAll('.sr-slot').forEach(function(s){ s.classList.remove('drag-over'); });
    if (info.ghost) info.ghost.remove();
    var srTarget = findDropSrSlot(e.clientX, e.clientY, info);
    if (srTarget) {
      srDoPlace(info.qIdx, info.origIdx, info.fromPos, parseInt(srTarget.dataset.pos));
    } else if (info.fromPos !== null) {
      srRemovePiece(info.qIdx, info.fromPos); /* 從格子拖出去、沒放到任何格子上 → 退回詞卡池 */
      renderSrPieces();
    } else {
      renderSrPieces(); /* 從詞卡池拖出來但沒放到格子上 → 什麼都沒變，只是重畫讓它歸位 */
    }
    return;
  }

  document.querySelectorAll('.q-blank').forEach(function(b){ b.classList.remove('drag-over'); });
  if (info.ghost) info.ghost.remove();
  var target = findDropBlank(e.clientX, e.clientY, info);
  target ? doPlace(info.word, info.fromQIdx, parseInt(target.dataset.qidx))
         : renderAll();
}

/* ════════════ Drop detection — text blanks ════════════ */
function findDropBlank(x, y, info) {
  var best = null, bestDist = Infinity;
  document.querySelectorAll('.q-blank').forEach(function(el) {
    var qIdx = parseInt(el.dataset.qidx);
    var q    = quizData[qIdx];
    if (!q || POOL_KEY[q.type] !== info.poolKey) return;
    if (info.fromQIdx === qIdx) return;
    var r  = el.getBoundingClientRect();
    if (x < r.left - DROP_TOL || x > r.right  + DROP_TOL ||
        y < r.top  - DROP_TOL || y > r.bottom + DROP_TOL) return;
    var dist = Math.sqrt(Math.pow(x - (r.left + r.width/2), 2) +
                         Math.pow(y - (r.top  + r.height/2), 2));
    if (dist < bestDist) { bestDist = dist; best = el; }
  });
  return best;
}

/* ════════════ Place word ════════════ */
function doPlace(word, fromQIdx, toQIdx) {
  if (fromQIdx !== null) blanks[fromQIdx] = undefined;
  blanks[toQIdx] = word;
  renderAll();
}


/* ════════════ Submit / Grade ════════════ */
function submitQuiz() {
  if (graded) return;
  /* 句子重組的「答完了沒」跟一般題目的 getAnswer() 分開算（一個題目裡有好幾個片段），
     unanswered 這裡只看一般題型；句子重組完全沒放任何片段才算未作答 */
  var unanswered = quizData.filter(function(q, i){
    return q.type !== '句子重組' && q.type !== '默寫生字' && getAnswer(i) === undefined;
  }).length;
  var srUnanswered = 0;
  quizData.forEach(function(q, i) {
    if (q.type === '句子重組' && !(srAnswers[i] || []).some(function(v){ return v !== undefined; })) srUnanswered++;
  });
  var dictUnanswered = 0;
  quizData.forEach(function(q, i) {
    if (q.type === '默寫生字' && dictMistakes[i] === undefined) dictUnanswered++; /* 連一筆都還沒寫過 */
  });
  var matchUnanswered = 0;
  matchData.forEach(function(msec, si) {
    var conns = matchConnections[si] || {};
    (msec.imgOrder || []).forEach(function(_, imgPos) {
      if (conns[imgPos] === undefined) matchUnanswered++;
    });
  });
  var totalUnanswered = unanswered + srUnanswered + dictUnanswered + matchUnanswered;
  if (totalUnanswered > 0 && !confirm('還有 ' + totalUnanswered + ' 題未作答，確定要送出嗎？')) return;

  graded = true;
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.getElementById('btn-submit').disabled = true;

  document.querySelectorAll('.pool-word, .sr-piece').forEach(function(el){
    el.style.pointerEvents = 'none';
    el.style.cursor        = 'default';
    el.style.opacity       = '.4';
  });

  /* Pre-calculate text question totals（句子重組、默寫生字都不在這裡算，各自用自己的邏輯
     分開算，底下兩段） */
  var correct = 0, wrongIndices = [];
  quizData.forEach(function(q, i) {
    if (q.type === '句子重組' || q.type === '默寫生字') return;
    var ua      = getAnswer(i);
    var isRight = ua !== undefined && ua === q.answer;
    if (isRight) correct++; else wrongIndices.push(i);
  });
  var textTotal = quizData.filter(function(q) { return q.type !== '句子重組' && q.type !== '默寫生字'; }).length;

  /* Pre-calculate 句子重組 totals — 每個片段的位置都算一個計分單位，對幾個算幾個（跟連連看的配對同邏輯） */
  var srCorrect = 0, srTotal = 0;
  var wrongSrQuestions = [];
  quizData.forEach(function(q, i) {
    if (q.type !== '句子重組') return;
    var placedIdx = srAnswers[i] || [];
    var opts = q.options || [];
    var rightCount = 0;
    opts.forEach(function(_, pos) { if (placedIdx[pos] === pos) rightCount++; });
    srTotal += opts.length;
    srCorrect += rightCount;
    if (rightCount < opts.length) {
      var hasAny = placedIdx.some(function(oi) { return oi !== undefined; });
      wrongSrQuestions.push({
        correctSentence: opts.join(''),
        yourSentence: hasAny ? placedIdx.map(function(oi){ return oi !== undefined ? opts[oi] : '＿'; }).join('') : '未作答'
      });
    }
  });

  /* Pre-calculate 默寫生字 totals——一題一個字、二元算對錯（跟一般文字題同邏輯，不是像
     句子重組那樣拆更細的單位），通過門檻照抄練字趣 exam.js：mistakes<=3 算對，描字模式
     完成（finishDictQuiz 把 mistakes 設成 99）或整個沒寫過都算錯 */
  var dictCorrect = 0, dictTotal = 0, wrongDictQuestions = [];
  quizData.forEach(function(q, i) {
    if (q.type !== '默寫生字') return;
    dictTotal++;
    try { if (dictWriters[i] && !dictDone[i]) dictWriters[i].cancelQuiz(); } catch (e) {}
    var mistakes = dictMistakes[i];
    var passed = mistakes !== undefined && mistakes <= 3;
    if (passed) { dictCorrect++; }
    else { wrongDictQuestions.push({ char: q.question, zhuyin: q.zhuyin || '' }); }
  });

  /* Pre-calculate match totals and wrong pairs */
  var matchCorrect = 0, matchTotal = 0;
  var wrongMatchSections = [];
  matchData.forEach(function(msec, si) {
    var conns = matchConnections[si] || {};
    var wrongPairs = [];
    (msec.imgOrder || []).forEach(function(pairIdx, imgPos) {
      matchTotal++;
      var wordPos = conns[imgPos];
      var isCorrect = wordPos !== undefined && msec.wordOrder[wordPos] === pairIdx;
      if (isCorrect) {
        matchCorrect++;
      } else {
        wrongPairs.push({
          imageUrl:  msec.pairs[pairIdx].imageUrl,
          word:      msec.pairs[pairIdx].word,
          connected: wordPos !== undefined ? msec.pairs[msec.wordOrder[wordPos]].word : '未作答'
        });
      }
    });
    if (wrongPairs.length) wrongMatchSections.push({ title: msec.title, wrong: wrongPairs });
  });

  /* Staggered per-question reveal: 120 ms between each */
  var STAGGER = 120;
  quizData.forEach(function(q, i) {
    if (q.type === '句子重組') { setTimeout(function() { _applySrGradeVisual(i); }, i * STAGGER + 160); return; }
    if (q.type === '默寫生字') { setTimeout(function() { _applyDictGradeVisual(i); }, i * STAGGER + 160); return; }
    var ua      = getAnswer(i);
    var isRight = ua !== undefined && ua === q.answer;
    setTimeout(function() { _applyGradeVisual(q, i, ua, isRight); }, i * STAGGER + 160);
  });
  /* Match sections reveal after text questions — re-render with graded classes + SVG color */
  var matchDelay = quizData.length * STAGGER + 160;
  setTimeout(function() { if (graded) renderMatchSections(); }, matchDelay);

  /* Show result after all animations complete */
  var totalDelay = (quizData.length + (matchData.length ? 1 : 0)) * STAGGER + 480;
  var snapCorrect = correct, snapMatchCorrect = matchCorrect, snapSrCorrect = srCorrect, snapDictCorrect = dictCorrect;
  var snapWrong = wrongIndices.slice();
  var snapTotal  = textTotal + matchTotal + srTotal + dictTotal;
  var snapWrongMatchSections = wrongMatchSections;
  var snapWrongSrQuestions = wrongSrQuestions;
  var snapWrongDictQuestions = wrongDictQuestions;
  setTimeout(function() {
    if (!graded) return;
    var allCorrect = snapCorrect + snapMatchCorrect + snapSrCorrect + snapDictCorrect;
    var score = snapTotal ? Math.round(allCorrect / snapTotal * 100) : 100;
    saveScore(score, allCorrect, snapTotal);
    showResult(snapCorrect, textTotal, snapWrong, snapMatchCorrect, matchTotal, snapWrongMatchSections,
               snapSrCorrect, srTotal, snapWrongSrQuestions, snapDictCorrect, dictTotal, snapWrongDictQuestions);
  }, totalDelay);
}

/* 默寫生字交卷時的揭曉視覺——寫字格邊框變綠/紅，狀態文字更新成最終結果 */
function _applyDictGradeVisual(i) {
  var box    = document.getElementById('dict-writer-' + i);
  var status = document.getElementById('dict-status-' + i);
  var mistakes = dictMistakes[i];
  var passed = mistakes !== undefined && mistakes <= 3;
  if (box) box.classList.add(passed ? 'dict-graded-right' : 'dict-graded-wrong');
  if (status) status.textContent = passed ? '✓ 寫對了！' : (mistakes === undefined ? '未作答' : '再多練習這個字');
}

function _applySrGradeVisual(i) {
  if (!graded) return;
  var q = quizData[i];
  if (!q) return;
  var opts = q.options || [];
  var placedIdx = srAnswers[i] || [];
  var allRight = placedIdx.length === opts.length && opts.every(function(_, pos) { return placedIdx[pos] === pos; });
  var row = document.getElementById('qr-' + i);
  if (row) row.classList.add(allRight ? 'graded-correct' : 'graded-wrong');
  var slotsEl = document.getElementById('sr-slots-' + i);
  if (slotsEl) {
    slotsEl.innerHTML = opts.map(function(_, pos) {
      var placedOi = placedIdx[pos];
      var isRight  = placedOi === pos;
      var text     = placedOi !== undefined ? opts[placedOi] : '—';
      return '<div class="sr-slot sr-slot-filled ' + (isRight ? 'graded-correct' : 'graded-wrong') + '">' + escHtml(text) + '</div>';
    }).join('');
  }
  var bankEl = document.getElementById('sr-bank-' + i);
  if (bankEl) bankEl.innerHTML = '';
}

function _applyGradeVisual(q, i, ua, isRight) {
  if (!graded) return; /* guard: quiz was reset before this callback fired */
  if (q.type === '選擇題') {
    var block = document.getElementById('qb-' + i);
    var icon  = document.getElementById('icon-' + i);
    if (block) block.classList.add(isRight ? 'graded-correct' : 'graded-wrong');
    if (icon)  icon.textContent = isRight ? '✓' : '✗';
    /* Match buttons by data-opt-text (position-independent) */
    document.querySelectorAll('#qb-' + i + ' .opt-btn').forEach(function(btn) {
      btn.disabled = true;
      if (btn.dataset.optText === q.answer)          btn.classList.add('correct');
      else if (btn.dataset.optText === ua && !isRight) btn.classList.add('wrong');
    });
    if (!isRight) {
      var hint = document.getElementById('hint-' + i);
      if (hint) hint.textContent = '正確答案：' + q.answer;
    }
  } else {
    var row     = document.getElementById('qr-' + i);
    var blankEl = document.getElementById('blank-' + i);
    if (row) row.classList.add(isRight ? 'graded-correct' : 'graded-wrong');
    if (blankEl) {
      blankEl.innerHTML = ua ? escHtml(ua) : '';
      if (ua) { blankEl.classList.add('filled'); blankEl.classList.remove('blank-placeholder'); }
    }
  }
}

/* ════════════ Score count-up ════════════ */
function _countUp(el, target, duration) {
  if (_countUpRAF) { cancelAnimationFrame(_countUpRAF); _countUpRAF = null; }
  var start = null;
  function step(ts) {
    if (!start) start = ts;
    var t = Math.min((ts - start) / duration, 1);
    var eased = 1 - Math.pow(1 - t, 3); /* ease-out cubic */
    el.textContent = Math.round(eased * target);
    if (t < 1) _countUpRAF = requestAnimationFrame(step);
    else _countUpRAF = null;
  }
  _countUpRAF = requestAnimationFrame(step);
}

/* ════════════ Result screen ════════════ */
function showResult(correct, total, wrongIndices, matchCorrect, matchTotal, wrongMatchSections,
                     srCorrect, srTotal, wrongSrQuestions, dictCorrect, dictTotal, wrongDictQuestions) {
  var allCorrect = correct + (matchCorrect || 0) + (srCorrect || 0) + (dictCorrect || 0);
  var allTotal   = total   + (matchTotal   || 0) + (srTotal   || 0) + (dictTotal   || 0);
  var score = allTotal ? Math.round(allCorrect / allTotal * 100) : 100;
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').classList.add('show');
  var scoreEl = document.getElementById('result-score');
  scoreEl.textContent = '0';
  _countUp(scoreEl, score, 900);
  document.getElementById('result-title').textContent =
    score >= 90 ? '太厲害了！🎉' : score >= 70 ? '做得很好！👍' :
    score >= 50 ? '繼續加油！💪' : '多多練習吧！📖';
  var subParts = ['共答對 ' + allCorrect + ' 題，答錯 ' + (allTotal - allCorrect) + ' 題'];
  if (matchTotal) subParts.push('詞圖配對 ' + (matchCorrect || 0) + '/' + matchTotal + ' 組');
  if (srTotal)     subParts.push('句子重組 ' + (srCorrect   || 0) + '/' + srTotal   + ' 塊');
  if (dictTotal)   subParts.push('默寫生字 ' + (dictCorrect || 0) + '/' + dictTotal + ' 字');
  document.getElementById('result-sub').textContent = subParts.join('　');
  var reviewHtml = '';
  if (wrongIndices.length) reviewHtml += buildReviewHtml(wrongIndices);
  if (wrongSrQuestions && wrongSrQuestions.length) reviewHtml += buildSrReviewHtml(wrongSrQuestions);
  if (wrongDictQuestions && wrongDictQuestions.length) reviewHtml += buildDictReviewHtml(wrongDictQuestions);
  if (wrongMatchSections && wrongMatchSections.length) reviewHtml += buildMatchReviewHtml(wrongMatchSections);
  document.getElementById('review-container').innerHTML = reviewHtml;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildDictReviewHtml(wrongDictQuestions) {
  return '<div class="review-section">' +
    '<div class="review-header">默寫生字</div>' +
    wrongDictQuestions.map(function(item) {
      return '<div class="review-item">' +
        '<div class="review-answers">' +
          '<div><span class="review-correct-ans q-speakable" onclick="speakText(\'' + escJs(item.char) +
            '\')" title="點擊聆聽">' + escHtml(item.char) +
            (item.zhuyin ? '　' + escHtml(item.zhuyin) : '') + '　再多練習這個字</span></div>' +
        '</div>' +
      '</div>';
    }).join('') +
  '</div>';
}

function buildSrReviewHtml(wrongSrQuestions) {
  return '<div class="review-section">' +
    '<div class="review-header">句子重組</div>' +
    wrongSrQuestions.map(function(item) {
      return '<div class="review-item">' +
        '<div class="review-answers">' +
          '<div><span class="review-wrong-ans">你排的：' + escHtml(item.yourSentence) + '</span></div>' +
          '<div><span class="review-correct-ans q-speakable" onclick="speakText(\'' + escJs(item.correctSentence) +
            '\')" title="點擊聆聽">正確：' + escHtml(item.correctSentence) + '</span></div>' +
        '</div>' +
      '</div>';
    }).join('') +
  '</div>';
}

function buildReviewHtml(wrongIndices) {
  return '<div class="review-section">' +
    '<div class="review-header">錯誤題目解析</div>' +
    wrongIndices.map(function(i) {
      var q      = quizData[i];
      var ua     = getAnswer(i);
      var before = quizData.slice(0, i).filter(function(qq){ return qq.type === q.type; }).length;
      var label  = q.type + '　第 ' + (before + 1) + ' 題';
      var ansHtml;
      if (q.type === '選擇題') {
        var co = q.answer;           /* correct option plain text */
        var uo = ua || '未作答';     /* selected option plain text */
        ansHtml = '<div class="review-answers">' +
          '<span class="review-wrong-ans">'   + escHtml(uo) + '</span>' +
          '<span class="review-arrow">→</span>' +
          '<span class="review-correct-ans q-speakable" onclick="speakText(\'' + escJs(co) + '\')">' + escHtml(co) + '</span></div>';
      } else {
        /* 詞語填空：唸完整句（答案嵌入空格）；詞語解釋：唸答案本身 */
        var fullSentence = q.type === '詞語填空'
          ? q.question.replace(/[（(][^）)]*[）)]/, q.answer)
          : q.answer;
        ansHtml = '<div class="review-answers">' +
          '<span class="review-wrong-ans">你填：'  + escHtml(ua || '未作答') + '</span>' +
          '<span class="review-arrow">→</span>' +
          '<span class="review-correct-ans q-speakable" onclick="speakText(\'' + escJs(fullSentence) + '\')" title="點擊聆聽">正確：' + escHtml(q.answer) + '</span></div>';
      }
      return '<div class="review-item">' +
        '<div class="review-item-label">' + escHtml(label)       + '</div>' +
        '<div class="review-item-q q-speakable" onclick="speakText(\'' +
          escJs(q.question) + '\')">'     + escHtml(q.question)  + '</div>' +
        ansHtml + '</div>';
    }).join('') +
  '</div>';
}

function buildMatchReviewHtml(wrongMatchSections) {
  return wrongMatchSections.map(function(sec) {
    return '<div class="review-section">' +
      '<div class="review-header">連連看：' + escHtml(sec.title) + '</div>' +
      sec.wrong.map(function(pair) {
        return '<div class="review-item">' +
          '<div class="review-match-pair">' +
            '<img class="review-match-img" src="' + escHtml(pair.imageUrl) + '" alt="">' +
            '<div class="review-match-answers">' +
              '<div><span class="review-wrong-ans">你連的：' + escHtml(pair.connected) + '</span></div>' +
              '<div><span class="review-correct-ans">正確答案：' + escHtml(pair.word) + '</span></div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }).join('');
}

/* ════════════ 作答明細（教師端列印用）════════════
   題目內容整份快照下來，不只存 questionId——老師之後改了題庫，印出來的仍然要是學生當時
   看到的題目。Firestore 不接受 undefined，沒作答一律存 null */
function _buildResultDetails() {
  var order = _sectionTypeOrder().filter(function(t) {
    return quizData.some(function(q) { return q.type === t; });
  });
  var questions = quizData.map(function(q, i) {
    var item = { id: q.id || '', type: q.type, question: q.question, answer: q.answer || '',
                 options: q.options || [], zhuyin: q.zhuyin || '', hintWord: q.hintWord || '' };
    if (q.type === '句子重組') {
      var placed = srAnswers[i] || [];
      item.placed = (q.options || []).map(function(_, pos) {
        return placed[pos] === undefined ? null : placed[pos];
      });
      item.right = item.placed.filter(function(oi, pos) { return oi === pos; }).length;
      item.ok = item.right === (q.options || []).length;
    } else if (q.type === '默寫生字') {
      var m = dictMistakes[i];
      item.ok = m !== undefined && m <= 3;
    } else {
      var ua = getAnswer(i);
      item.ua = ua === undefined ? null : ua;
      item.ok = ua !== undefined && ua === q.answer;
    }
    return item;
  });
  var match = matchData.map(function(msec, si) {
    var conns = matchConnections[si] || {};
    return {
      title:  msec.title || '',
      points: msec.points || '',
      pairs:  (msec.imgOrder || []).map(function(pairIdx, imgPos) {
        var wordPos = conns[imgPos];
        var connected = wordPos !== undefined ? msec.pairs[msec.wordOrder[wordPos]].word : null;
        return { word: msec.pairs[pairIdx].word, imageUrl: msec.pairs[pairIdx].imageUrl || '',
                 connected: connected, ok: wordPos !== undefined && msec.wordOrder[wordPos] === pairIdx };
      })
    };
  });
  return {
    sectionOrder:  order,
    sectionPoints: (currentSettings && currentSettings.sectionPoints) || {},
    questions:     questions,
    match:         match
  };
}

/* ════════════ Save to Firestore ════════════ */
function saveScore(score, correct, total) {
  if (!db || !student) return;
  var now   = new Date().toISOString();
  var grade  = (quizData[0] && quizData[0].grade)  || '練習卷';
  var lesson = (quizData[0] && quizData[0].lesson) || '';

  /* 原有：個人活動紀錄 */
  db.collection('students').doc(student.id).collection('activities').add({
    app: 'chinese-quiz', score: score, correct: correct, total: total,
    grade: grade, lesson: lesson, timestamp: now
  }).catch(function(){});

  /* 新增：跨學生可查詢的測驗結果（教師看最高分、學生看歷史） */
  if (currentSession && currentSession.sessionId) {
    /* 先產生 docId，作答明細用同一個 id 存到 quizResultDetails（只有出題老師讀得到），
       教師端才能把這次作答整份印出來給家長看。明細另外放一個集合、不塞進 quizResults：
       quizResults 是公開可讀的，而且測驗列表一次會讀老師所有的成績，明細放進去會很肥 */
    var resultRef = db.collection('quizResults').doc();
    db.collection('quizResultDetails').doc(resultRef.id).set({
      sessionId:   currentSession.sessionId,
      teacherUid:  currentSession.teacherUid,
      studentId:   student.id,
      studentName: student.name || student.nickname || '',
      score:       score,
      timestamp:   now,
      details:     _buildResultDetails()
    }).catch(function(){});
    resultRef.set({
      sessionId:   currentSession.sessionId,
      sessionCode: currentSession.sessionCode,
      sessionName: currentSession.sessionName,
      teacherUid:  currentSession.teacherUid,
      studentId:   student.id,
      studentName: student.nickname || student.name || '',
      score:       score,
      correct:     correct,
      total:       total,
      grade:       grade,
      lesson:      lesson,
      lessonName:  (currentSettings && currentSettings.lessonName) || '',
      timestamp:   now
    }).catch(function(){});
  }
}

/* ════════════ Retry ════════════ */
function retryQuiz() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  matchConnections = {};
  loadQuestions(); /* re-reads quiz_settings → fresh random sample from same lesson */
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
