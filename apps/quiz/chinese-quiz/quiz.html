</div>

      <button class="btn-return-hub" onclick="returnToHub()">返回主頁</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

/* ════════════ Fallback questions ════════════ */
var FALLBACK = [

    answer: '放棄' },

  { type: '選擇題', question: '「他哭了整整一千年，眼淚染紅了整片大海。」主要使用了哪種修辭？',
    answer: 'B', options: ['A. 比喻', 'B. 誇飾', 'C. 擬人'] }
];

/* ════════════ Constants ════════════ */
var TYPE_ORDER   = ['詞語填空', '詞語解釋', '選擇題'];
var SECTION_NUMS = ['一', '二', '三', '四', '五'];
var POOL_KEY     = { '詞語填空': 'fill', '詞語解釋': 'explain' };
var DROP_TOL     = 44;  /* px expanded hit area around each blank */
var DRAG_THOLD   = 8;   /* px movement needed to start drag vs tap */

/* ════════════ State ════════════ */
var db              = null;
var student         = null;
var currentSettings = null; /* { grade, lesson, lessonName, counts } */
var currentSession  = null; /* { sessionId, sessionCode, sessionName, teacherUid } */
var quizData        = [];
var poolOrder       = {};
var blanks          = {};   /* { qIdx: word | undefined } */
var mcAnswers       = {};   /* { qIdx: 'A'|'B'|'C' } */
var graded          = false;
var dragging        = null; /* active drag: { word, poolKey, fromQIdx, ghost } */
var pendingDrag     = null; /* pre-threshold: { word, poolKey, fromQIdx, sx, sy } */
var _dragY          = 0;    /* last known drag clientY — used by auto-scroll loop */
var _scrollRAF      = null; /* rAF id for drag auto-scroll */
var _countUpRAF     = null; /* rAF id for score count-up animation */
var matchData        = [];   /* [{title,pairs:[{wordId,word,imageUrl}],imgOrder:[],wordOrder:[]}] */
var matchConnections = {};   /* {si: {imgPos: wordPos}} */
var _matchConnDrag   = null; /* currently unused — drag state lives in `dragging` */

/* ════════════ Utilities ════════════ */
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escJs(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

function returnToHub() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  window.parent.postMessage({ type: 'chinese-quiz-back-to-hub' }, '*');
}

function confirmBack() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  var hasInput = Object.keys(blanks).some(function(k){ return blanks[k]; }) ||
                 Object.keys(mcAnswers).length > 0 ||
                 Object.keys(matchConnections).some(function(si){ return Object.keys(matchConnections[si] || {}).length > 0; });
  if (!graded && hasInput && !confirm('作答尚未完成，確定要離開嗎？')) return;
  returnToHub();
}

function getAnswer(i) {
  return quizData[i].type === '選擇題' ? mcAnswers[i] : blanks[i];
}

/* ════════════════════════════════════════
   Text-to-Speech
   ════════════════════════════════════════
   speakText(text)      — single string, no pause
   speakQuestion(qIdx)  — full sentence; fill-type splits at blanks
                          with 500ms silence at each gap
   ════════════════════════════════════════ */
function speakText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var utt  = new SpeechSynthesisUtterance(String(text).trim());
  utt.lang = 'zh-TW';
  utt.rate = 0.82;
  window.speechSynthesis.speak(utt);
}

function speakQuestion(qIdx) {
  if (!window.speechSynthesis) { showToast('此裝置不支援朗讀功能'); return; }
  window.speechSynthesis.cancel();
  var q    = quizData[qIdx];
  var text = q.question;
  /* 詞語填空：有填入答案時，把空格替換成答案後整句朗讀 */
  if (q.type === '詞語填空' && blanks[qIdx]) {
    _speak(text.replace(/[（(][^）)]*[）)]/, blanks[qIdx]), null);
    return;
  }
  var parts = text.split(/[（(][^）)]*[）)]/);   /* split at blank markers（全形或半形括號） */
  parts.length === 1 ? _speak(text, null) : _speakParts(parts, 0);
}

function _speak(text, onEnd) {
  var utt  = new SpeechSynthesisUtterance(text.trim());
  utt.lang = 'zh-TW';
  utt.rate = 0.82;
  if (onEnd) utt.onend = onEnd;
  window.speechSynthesis.speak(utt);
}

function _speakParts(parts, idx) {
  if (idx >= parts.length) return;
  var part   = parts[idx].trim();
  var isLast = idx === parts.length - 1;
  var next   = function() {
    if (!isLast) setTimeout(function(){ _speakParts(parts, idx + 1); }, 500);
  };
  part ? _speak(part, next) : next();
}

/* ════════════ Init ════════════ */
window.addEventListener('load', function() {

  if (!student) {

      '<button class="btn-quiz-back" style="margin-top:16px" onclick="returnToHub()">← 返回</button>';
    return;
  }

  var name = student.nickname || student.name;

/* ════════════ Question loading ════════════ */
function loadQuestions() {
  var settings;
  try { settings = JSON.parse(sessionStorage.getItem('quiz_settings')); } catch(e) {}

  var hasIds   = settings && settings.questionIds && settings.questionIds.length;
  var hasMatch = settings && settings.matchSections && settings.matchSections.length;

  if (!settings || (!hasIds && !hasMatch && (!settings.grade || !settings.lesson))) {
    currentSession = null;
    startQuiz(FALLBACK, null, []);
    return;
  }

  currentSession = {
    sessionId:   settings.sessionId   || '',
    sessionCode: settings.sessionCode || '',
    sessionName: settings.sessionName || '',
    teacherUid:  settings.teacherUid  || ''
  };

  /* ── 固定題組 + 詞圖配對 ── */
  if (hasIds || hasMatch) {
    if (!db) { startQuiz(hasIds ? FALLBACK : [], settings, []); return; }

    var textPromise = hasIds
      ? Promise.all(settings.questionIds.map(function(id) {
          return db.collection('questions').doc(id).get();
        }))
      : Promise.resolve([]);

    var matchRaw = settings.matchSections || [];
    var matchPromise = matchRaw.length
      ? Promise.all(matchRaw.map(function(msec) {
          var wordIds = msec.wordIds || [];
          return Promise.all(wordIds.map(function(wid) {
            return db.collection('wordImages').doc(wid).get();
          })).then(function(wdocs) {
            var pairs = wordIds.map(function(wid, i) {
              var wd = wdocs[i];
              return {
                wordId:   wid,
                word:     (msec.words && msec.words[i]) || (wd.exists ? wd.data().word : ''),
                imageUrl: wd.exists ? (wd.data().imageUrl || '') : ''
              };
            });
            var indices = pairs.map(function(_, i) { return i; });
            return {
              title:     msec.title,
              pairs:     pairs,
              imgOrder:  shuffle(indices.slice()),
              wordOrder: shuffle(indices.slice())
            };
          });
        }))
      : Promise.resolve([]);

    Promise.all([textPromise, matchPromise]).then(function(results) {
      var qdocs = results[0], matchLoaded = results[1];
      var questions = [];
      qdocs.forEach(function(doc) {
        if (!doc.exists) return;
        var d = doc.data();
        if (d.type && d.question && d.answer) {
          questions.push({ type: d.type, question: d.question, answer: d.answer,
                           options: d.options || [], grade: d.grade, lesson: d.lesson });
        }
      });
      if (!questions.length && !matchLoaded.length) {
        startQuiz(FALLBACK, null, []);
      } else {
        startQuiz(questions, settings, matchLoaded);
      }
    }).catch(function() { startQuiz(FALLBACK, null, []); });
    return;
  }

  if (!db) { startQuiz(FALLBACK, null); return; }

  var grade      = settings.grade;
  var lesson     = settings.lesson;
  var teacherUid = settings.teacherUid || '';

  /* Two queries: teacher's own bank + shared bank.
     Each uses (teacherUid, grade) which maps to the composite index.
     Lesson is filtered client-side to avoid a third index field. */
  var queries = [
    db.collection('questions').where('teacherUid', '==', 'shared').where('grade', '==', grade).get()
  ];
  if (teacherUid && teacherUid !== 'shared') {
    queries.push(
      db.collection('questions').where('teacherUid', '==', teacherUid).where('grade', '==', grade).get()
    );
  }

  Promise.all(queries)
    .then(function(results) {
      var seen = {};
      var all  = [];
      results.forEach(function(snap) {
        snap.docs.forEach(function(d) {
          if (seen[d.id]) return;
          seen[d.id] = true;
          var v = d.data();
          if (v.type && v.question && v.answer && v.lesson === lesson) {
            all.push({ type: v.type, question: v.question, answer: v.answer,
                       options: v.options || [], grade: v.grade, lesson: v.lesson });
          }
        });
      });

      if (!all.length) { startQuiz(FALLBACK, null, []); return; }

      var sampled = [];
      TYPE_ORDER.forEach(function(type) {
        var n = ((settings.counts || {})[type]) || 0;
        if (!n) return;
        var pool = shuffle(all.filter(function(q){ return q.type === type; }));
        sampled = sampled.concat(pool.slice(0, n));
      });

      startQuiz(sampled.length ? sampled : FALLBACK,
                sampled.length ? settings : null, []);
    })
    .catch(function() { startQuiz(FALLBACK, null, []); });
}

/* ════════════════════════════════════════
   MC normalisation
   Old Firestore docs store options as ['A. text', ...] and answer as 'A'.
   New docs store options as plain text and answer as the correct option text.
   _normMCQuestion converts old → new so the renderer only needs one path.
   ════════════════════════════════════════ */
function _normMCQuestion(q) {
  if (q.type !== '選擇題') return q;
  var opts = (q.options || []).slice();
  var ans  = String(q.answer || '');
  /* Detect old format: answer is a single letter AND options start with 'A.'/'B.'/'C.' */
  var isOld = /^[A-C]$/i.test(ans) && opts.length > 0 && /^[A-C][.．、]/.test(opts[0] || '');
  if (!isOld) return q;
  var clean  = opts.map(function(o) { return o.replace(/^[A-C][.．、]\s*/, '').trim(); });
  var ansIdx = ans.toUpperCase().charCodeAt(0) - 65;
  return { type: q.type, question: q.question, answer: clean[ansIdx] || ans,
           options: clean, grade: q.grade, lesson: q.lesson };
}

function startQuiz(qs, settings, matchLoaded) {
  quizData         = qs.map(_normMCQuestion);
  matchData        = matchLoaded || [];
  blanks           = {};
  mcAnswers        = {};
  matchConnections = {};
  graded           = false;
  pendingDrag      = null;
  currentSettings = settings || null;
  if (_countUpRAF) { cancelAnimationFrame(_countUpRAF); _countUpRAF = null; }

  /* Update lesson info in sheet header */
  var lessonEl = document.getElementById('sheet-lesson');
  if (lessonEl) {
    if (settings && settings.grade && settings.lesson) {
      var label = settings.grade + '　第' + settings.lesson + '課';
      if (settings.lessonName && settings.lessonName !== settings.lesson)
        label += '　' + settings.lessonName;
      lessonEl.textContent = label;
    } else {
      lessonEl.textContent = '';
    }
  }

  ['fill', 'explain'].forEach(function(pk) {
    var typeKey = pk === 'fill' ? '詞語填空' : '詞語解釋';
    poolOrder[pk] = shuffle(
      quizData.filter(function(q){ return q.type === typeKey; })
              .map(function(q){ return q.answer; })
    );
  });

  document.getElementById('loading-msg').style.display = 'none';
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('btn-submit').disabled = false;
  document.getElementById('quiz-screen').style.display = '';

  renderSections();
  renderAll();
}

/* ════════════ Rendering — sections ════════════ */
function renderSections() {
  var html = '';
  var sn   = 0;

  TYPE_ORDER.forEach(function(type) {
    var qs = quizData.filter(function(q){ return q.type === type; });
    if (!qs.length) return;
    var pk = POOL_KEY[type];

    html += '<div class="q-section">' +
      '<div class="section-header">' +
        '<span class="section-num">'  + SECTION_NUMS[sn] + '、</span>' +
        '<span class="section-type">' + escHtml(type)    + '</span>' +
      '</div>';

    if (pk) {
      html += '<div class="pool-area">' +
        '<div class="pool-label">答案池　請將詞卡拖曳至各題空格中</div>' +
        '<div class="pool-words" id="pool-' + pk + '"></div>' +
      '</div>';
    }

    html += '<div class="q-list">';
    qs.forEach(function(q, j) { html += renderQuestion(q, quizData.indexOf(q), j + 1); });
    html += '</div></div>';
    sn++;
  });

  html += '<div id="match-sections-container"></div>';
  document.getElementById('sections-container').innerHTML = html;
  renderMatchSections();
}

/* ════════════ Match section rendering ════════════ */
function _textSectionCount() {
  return TYPE_ORDER.filter(function(t) {
    return quizData.some(function(q) { return q.type === t; });
  }).length;
}

function renderMatchSections() {
  var el = document.getElementById('match-sections-container');
  if (!el) return;
  el.innerHTML = matchData.map(function(_, si) { return renderMatchSection(si); }).join('');
  requestAnimationFrame(updateAllMatchSvg);
}

function renderMatchSection(si) {
  var msec   = matchData[si];
  if (!msec) return '';
  var n      = msec.pairs.length;
  var secNum = SECTION_NUMS[_textSectionCount() + si] || String(_textSectionCount() + si + 1);
  var imgSz  = n <= 4 ? 90 : n <= 6 ? 76 : 62;
  var conns  = matchConnections[si] || {};

  var leftHtml = (msec.imgOrder || []).map(function(pairIdx, imgPos) {
    var pair = msec.pairs[pairIdx];
    var gradeClass = '';
    if (graded) {
      var wp      = conns[imgPos];
      var isRight = wp !== undefined && msec.wordOrder[wp] === pairIdx;
      gradeClass  = isRight ? ' graded-correct' : ' graded-wrong';
    }
    return '<div class="match-item match-item-img' + gradeClass + '" data-si="' + si +
        '" data-side="img" data-pos="' + imgPos + '">' +
      '<img class="match-img" src="' + escHtml(pair.imageUrl || '') + '" alt=""' +
        ' style="width:' + imgSz + 'px;height:' + imgSz + 'px">' +
      (!graded ? '<div class="match-ep match-ep-right"></div>' : '') +
    '</div>';
  }).join('');

  var rightHtml = (msec.wordOrder || []).map(function(pairIdx, wordPos) {
    var pair = msec.pairs[pairIdx];
    var gradeClass = '';
    if (graded) {
      var connImgPos = null;
      Object.keys(conns).forEach(function(ip) {
        if (parseInt(conns[ip]) === wordPos) connImgPos = parseInt(ip);
      });
      var isRight = connImgPos !== null && msec.imgOrder[connImgPos] === pairIdx;
      gradeClass  = isRight ? ' graded-correct' : ' graded-wrong';
    }
    return '<div class="match-item match-item-word' + gradeClass + '" data-si="' + si +
        '" data-side="word" data-pos="' + wordPos + '">' +
      (!graded ? '<div class="match-ep match-ep-left"></div>' : '') +
      '<span class="match-word-label">' + escHtml(pair.word) + '</span>' +
    '</div>';
  }).join('');

  return '<div class="q-section">' +
    '<div class="section-header">' +
      '<span class="section-num">'  + escHtml(secNum)     + '、</span>' +
      '<span class="section-type">' + escHtml(msec.title) + '</span>' +
    '</div>' +
    '<p class="match-hint">請拖曳連接圖片與對應的詞語</p>' +
    '<div class="match-connect-wrap" id="match-wrap-' + si + '">' +
      '<div class="match-col-left" style="flex:0 0 auto;width:' + (imgSz + 8) + 'px">'  + leftHtml  + '</div>' +
      '<svg class="match-svg" id="match-svg-' + si + '" pointer-events="none"></svg>' +
      '<div class="match-col-right">' + rightHtml + '</div>' +
    '</div>' +
  '</div>';
}

/* ── SVG connector helpers ── */

function _epCenter(si, side, pos) {
  var cls  = side === 'img' ? '.match-ep-right' : '.match-ep-left';
  var ep   = document.querySelector(
    '.match-item[data-si="' + si + '"][data-side="' + side + '"][data-pos="' + pos + '"] ' + cls);
  var wrap = document.getElementById('match-wrap-' + si);
  if (!ep || !wrap) return null;
  var er = ep.getBoundingClientRect();
  var wr = wrap.getBoundingClientRect();
  return { x: er.left + er.width / 2 - wr.left, y: er.top + er.height / 2 - wr.top };
}

function updateMatchSvg(si, rubberband) {
  var svgEl = document.getElementById('match-svg-' + si);
  var msec  = matchData[si];
  if (!svgEl || !msec) return;
  var conns = matchConnections[si] || {};
  var out   = '';

  Object.keys(conns).forEach(function(ipStr) {
    var imgPos  = parseInt(ipStr);
    var wordPos = conns[imgPos];
    var p1 = _epCenter(si, 'img',  imgPos);
    var p2 = _epCenter(si, 'word', wordPos);
    if (!p1 || !p2) return;

    var pairIdx = msec.imgOrder[imgPos];
    var isRight = msec.wordOrder[wordPos] === pairIdx;
    var color   = !graded ? 'var(--accent)' : (isRight ? 'var(--correct)' : 'var(--wrong)');

    out += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p2.x + '" y2="' + p2.y +
      '" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round"></line>';

    if (!graded) {
      /* wide transparent hit-area for click-to-disconnect */
      out += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p2.x + '" y2="' + p2.y +
        '" stroke="transparent" stroke-width="20" pointer-events="stroke"' +
        ' style="cursor:pointer" onclick="disconnectMatch(' + si + ',' + imgPos + ')"></line>';
    }

    if (graded && !isRight) {
      /* dashed hint line to the correct word */
      var correctWPos = null;
      (msec.wordOrder || []).forEach(function(wpi, wp) {
        if (wpi === pairIdx) correctWPos = wp;
      });
      if (correctWPos !== null) {
        var p3 = _epCenter(si, 'word', correctWPos);
        if (p3) out += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p3.x + '" y2="' + p3.y +
          '" stroke="var(--correct)" stroke-width="1.5" stroke-dasharray="6,4"' +
          ' stroke-linecap="round" opacity="0.7"></line>';
      }
    }
  });

  if (graded) {
    /* dashed hint for unconnected images */
    (msec.imgOrder || []).forEach(function(pairIdx, imgPos) {
      if (conns[imgPos] !== undefined) return;
      var p1 = _epCenter(si, 'img', imgPos);
      var correctWPos = null;
      (msec.wordOrder || []).forEach(function(wpi, wp) { if (wpi === pairIdx) correctWPos = wp; });
      if (!p1 || correctWPos === null) return;
      var p3 = _epCenter(si, 'word', correctWPos);
      if (p3) out += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p3.x + '" y2="' + p3.y +
        '" stroke="var(--correct)" stroke-width="1.5" stroke-dasharray="6,4"' +
        ' stroke-linecap="round" opacity="0.7"></line>';
    });
  }

  if (rubberband) {
    out += '<line x1="' + rubberband.x1 + '" y1="' + rubberband.y1 +
      '" x2="' + rubberband.x2 + '" y2="' + rubberband.y2 +
      '" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8,4"' +
      ' stroke-linecap="round" opacity="0.75"></line>';
  }

  svgEl.innerHTML = out;
}

function updateAllMatchSvg() {
  matchData.forEach(function(_, si) { updateMatchSvg(si); });
}

function disconnectMatch(si, imgPos) {
  if (graded) return;
  if (!matchConnections[si]) return;
  delete matchConnections[si][imgPos];
  updateMatchSvg(si);
}

function doConnect(si, imgPos, wordPos) {
  if (!matchConnections[si]) matchConnections[si] = {};
  var conns = matchConnections[si];
  delete conns[imgPos];
  Object.keys(conns).forEach(function(ip) { if (conns[ip] === wordPos) delete conns[ip]; });
  conns[imgPos] = wordPos;
  updateMatchSvg(si);
}

function findMatchEndpointAt(x, y, si, side) {
  var best = null, bestDist = Infinity, TOL = 56;
  document.querySelectorAll('.match-item[data-si="' + si + '"][data-side="' + side + '"]')
    .forEach(function(el) {
      var r = el.getBoundingClientRect();
      if (x < r.left - TOL || x > r.right  + TOL ||
          y < r.top  - TOL || y > r.bottom + TOL) return;
      var dist = Math.sqrt(Math.pow(x - (r.left + r.width  / 2), 2) +
                           Math.pow(y - (r.top  + r.height / 2), 2));
      if (dist < bestDist) { bestDist = dist; best = parseInt(el.dataset.pos); }
    });
  return best;
}

function renderQuestion(q, qIdx, num) {
  if (q.type === '選擇題')  return renderMC(q, qIdx, num);
  if (q.type === '詞語填空') return renderFill(q, qIdx, num);
  return renderExplain(q, qIdx, num);
}

/* Click anywhere on the question text → speaks the full sentence */
function renderFill(q, qIdx, num) {
  var blankSpan = '<span class="q-blank blank-placeholder" id="blank-' + qIdx +
    '" data-qidx="' + qIdx + '"></span>';
  var textHtml = escHtml(q.question).replace(/[（(][^）)]*[）)]/, blankSpan);
  return '<div class="q-row" id="qr-' + qIdx + '">' +
    '<span class="q-num">' + num + '.</span>' +
    '<div class="q-text-wrap q-speakable" onclick="speakQuestion(' + qIdx + ')">' +
      textHtml +
    '</div>' +
  '</div>';
}

function renderExplain(q, qIdx, num) {
  return '<div class="q-row" id="qr-' + qIdx + '">' +
    '<span class="q-num">' + num + '.</span>' +
    '<div class="q-text-wrap q-speakable" onclick="speakQuestion(' + qIdx + ')">' +
      '<span class="q-def-text">' + escHtml(q.question) + '</span>' +
      '<span class="q-blank blank-placeholder" id="blank-' + qIdx +
        '" data-qidx="' + qIdx + '"></span>' +
    '</div>' +
  '</div>';
}

/* Click question text → speaks question; click option → selects + speaks option text only */
function renderMC(q, qIdx, num) {
  var LABELS  = ['A', 'B', 'C', 'D'];  /* positions after shuffle */
  var shuffled = shuffle((q.options || []).slice());
  var opts = shuffled.map(function(text, pos) {
    var label = LABELS[pos] || String(pos + 1);
    return '<button class="opt-btn" id="opt-' + qIdx + '-' + label + '"' +
      ' data-opt-text="' + escHtml(text) + '"' +
      ' onclick="selectOption(' + qIdx + ',\'' + escJs(text) + '\')">' +
      escHtml(label + '. ' + text) +
      '</button>';
  }).join('');
  return '<div class="q-block" id="qb-' + qIdx + '">' +
    '<div class="q-header">' +
      '<div class="q-num">' + num + '</div>' +
      '<div class="q-result-icon" id="icon-' + qIdx + '"></div>' +
    '</div>' +
    '<div class="q-text q-speakable" onclick="speakQuestion(' + qIdx + ')">' +
      escHtml(q.question) +
    '</div>' +
    '<div class="q-options">' + opts + '</div>' +
    '<div class="q-answer-hint" id="hint-' + qIdx + '"></div>' +
  '</div>';
}

/* ════════════ Live rendering ════════════ */
function renderAll() {
  if (graded) return;
  renderPools();
  renderBlanks();
  renderMatchSections();
}

function renderPools() {
  ['fill', 'explain'].forEach(function(pk) {
    var el = document.getElementById('pool-' + pk);
    if (!el) return;
    var typeKey = pk === 'fill' ? '詞語填空' : '詞語解釋';
    var placed  = {};
    quizData.forEach(function(q, i) {
      if (q.type === typeKey && blanks[i]) placed[blanks[i]] = true;
    });
    var fromPool = (dragging && dragging.poolKey === pk && dragging.fromQIdx === null)
      ? dragging.word : null;
    var visible = (poolOrder[pk] || []).filter(function(w) {
      return !placed[w] && w !== fromPool;
    });
    el.innerHTML = visible.length
      ? visible.map(function(w) {
          return '<div class="pool-word" data-word="' + escHtml(w) +
            '" data-pool="' + pk + '">' + escHtml(w) + '</div>';
        }).join('')
      : '<span class="pool-empty">（詞卡已全部填入）</span>';
  });
}

function renderBlanks() {
  quizData.forEach(function(q, i) {
    if (q.type === '選擇題') return;
    var el = document.getElementById('blank-' + i);
    if (!el) return;
    var isDraggingFrom = dragging && dragging.fromQIdx === i;
    var word = isDraggingFrom ? null : blanks[i];
    if (word) {
      el.innerHTML = escHtml(word) +
        '<button class="blank-remove" ' +
          'onpointerdown="event.stopPropagation()" ' +
          'onclick="event.stopPropagation();removeBlankWord(' + i + ')" ' +
          'title="移除">×</button>';
      el.classList.add('filled');
      el.classList.remove('blank-placeholder', 'drag-over');
    } else {
      el.innerHTML = '';
      el.classList.remove('filled', 'drag-over');
      el.classList.add('blank-placeholder');
    }
  });
}

/* ════════════ Remove word from blank ════════════ */
function removeBlankWord(qIdx) {
  if (graded) return;
  blanks[qIdx] = undefined;
  renderAll();
}

/* ════════════ MC interaction ════════════
   Clicking an option: selects it + speaks its text.
   Works even after grading (speaks, but doesn't change selection).
   ════════════════════════════════════════ */
function selectOption(qIdx, text) {
  /* Speak only the option text — no label prefix */
  speakText(text);
  if (graded) return;
  /* Toggle selected class: mark only the button whose data-opt-text matches */
  document.querySelectorAll('#qb-' + qIdx + ' .opt-btn').forEach(function(b) {
    b.classList.toggle('selected', b.dataset.optText === text);
  });
  mcAnswers[qIdx] = text;
}

/* ════════════════════════════════════════
   Pointer interaction — tap vs drag
   ════════════════════════════════════════
   Pool words and filled blanks use a movement threshold:
   • Small movement (< DRAG_THOLD px) → tap → speakText(word)
   • Large movement (≥ DRAG_THOLD px) → drag → startDrag()

   Question text areas use plain onclick (no conflict because
   e.preventDefault() on the blank/pool pointerdown suppresses
   the synthetic click event on ancestor elements).
   ════════════════════════════════════════ */
function onDelegatedPointerDown(e) {
  if (dragging) return;

  /* Pool word */
  var card = e.target.closest('.pool-word');
  if (card) {
    e.preventDefault(); /* suppress click on ancestors */
    pendingDrag = { dragKind: 'text', word: card.dataset.word, poolKey: card.dataset.pool,
                    fromQIdx: null, sx: e.clientX, sy: e.clientY };
    _addPendingListeners();
    return;
  }

  /* Filled blank (drag or tap to hear) */
  var blank = e.target.closest('.q-blank');
  if (blank && blank.classList.contains('filled') && !graded) {
    var qIdx = parseInt(blank.dataset.qidx);
    var word = blanks[qIdx];
    if (!word) return;
    e.preventDefault();
    pendingDrag = { dragKind: 'text', word: word, poolKey: POOL_KEY[quizData[qIdx].type],
                    fromQIdx: qIdx, sx: e.clientX, sy: e.clientY };
    _addPendingListeners();
    return;
  }

  /* Match item — start rubber-band connection drag */
  var matchItem = e.target.closest('.match-item');
  if (matchItem && !graded) {
    var msi  = parseInt(matchItem.dataset.si);
    var side = matchItem.dataset.side;
    var pos  = parseInt(matchItem.dataset.pos);
    e.preventDefault();
    /* disconnect existing connection from this endpoint so a new one can start */
    if (!matchConnections[msi]) matchConnections[msi] = {};
    if (side === 'img') {
      delete matchConnections[msi][pos];
    } else {
      Object.keys(matchConnections[msi]).forEach(function(ip) {
        if (matchConnections[msi][ip] === pos) delete matchConnections[msi][ip];
      });
    }
    updateMatchSvg(msi);
    pendingDrag = { dragKind: 'match-connect', si: msi, side: side, pos: pos,
                    sx: e.clientX, sy: e.clientY };
    _addPendingListeners();
    return;
  }
}

function _addPendingListeners() {
  document.addEventListener('pointermove',   _onPendingMove,   { passive: false });
  document.addEventListener('pointerup',     _onPendingUp);
  document.addEventListener('pointercancel', _onPendingCancel);
}

function _removePendingListeners() {
  document.removeEventListener('pointermove',   _onPendingMove);
  document.removeEventListener('pointerup',     _onPendingUp);
  document.removeEventListener('pointercancel', _onPendingCancel);
}

function _onPendingMove(e) {
  if (!pendingDrag) return;
  e.preventDefault();
  var dx = e.clientX - pendingDrag.sx;
  var dy = e.clientY - pendingDrag.sy;
  if (Math.sqrt(dx * dx + dy * dy) >= DRAG_THOLD) {
    var p = pendingDrag;
    pendingDrag = null;
    _removePendingListeners();
    startDrag(e, p);
  }
}

function _onPendingUp() {
  if (!pendingDrag) return;
  var p = pendingDrag;
  pendingDrag = null;
  _removePendingListeners();
  if (p.dragKind === 'match-connect') {
    /* Tap on word side → speak the word */
    if (p.side === 'word') {
      var msec = matchData[p.si];
      if (msec) speakText(msec.pairs[msec.wordOrder[p.pos]].word);
    }
    return;
  }
  /* Tap (small movement) → speak the word */
  speakText(p.word);
}

function _onPendingCancel() {
  pendingDrag = null;
  _removePendingListeners();
}

/* ════════════ Drag — core ════════════ */
function startDrag(e, p) {
  var ghost = null;
  if (p.dragKind !== 'match-connect') {
    ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.textContent = p.word;
    document.body.appendChild(ghost);
    posGhost(ghost, e.clientX, e.clientY);
  }

  _dragY   = e.clientY;
  dragging = Object.assign({}, p, { ghost: ghost });
  if (p.dragKind !== 'match-connect') renderAll();

  document.addEventListener('pointermove',   onDragMove,   { passive: false });
  document.addEventListener('pointerup',     onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
  _scrollRAF = requestAnimationFrame(_scrollLoop);
}

function posGhost(g, x, y) {
  g.style.left = (x - 32) + 'px';
  g.style.top  = (y - 38) + 'px';
}

/* Auto-scroll: runs every animation frame while dragging.
   Scrolls the page when the ghost is within ZONE px of the viewport edge. */
function _scrollLoop() {
  if (!dragging) { _scrollRAF = null; return; }
  var vh   = window.innerHeight;
  var ZONE = 80, MAX_SPD = 14;
  var spd  = 0;
  if      (_dragY < ZONE)       spd = -Math.ceil(MAX_SPD * (1 - _dragY / ZONE));
  else if (_dragY > vh - ZONE)  spd =  Math.ceil(MAX_SPD * (1 - (vh - _dragY) / ZONE));
  if (spd) window.scrollBy(0, spd);
  _scrollRAF = requestAnimationFrame(_scrollLoop);
}

function onDragMove(e) {
  e.preventDefault();
  if (!dragging) return;
  _dragY = e.clientY;

  if (dragging.dragKind === 'match-connect') {
    var si   = dragging.si;
    var wrap = document.getElementById('match-wrap-' + si);
    if (!wrap) return;
    var p1 = _epCenter(si, dragging.side, dragging.pos);
    if (!p1) return;
    var wr = wrap.getBoundingClientRect();
    var rb = { x1: p1.x, y1: p1.y, x2: e.clientX - wr.left, y2: e.clientY - wr.top };
    /* highlight nearest opposite-side endpoint */
    document.querySelectorAll('.match-ep').forEach(function(ep) { ep.classList.remove('match-ep-hover'); });
    var oppSide   = dragging.side === 'img' ? 'word' : 'img';
    var targetPos = findMatchEndpointAt(e.clientX, e.clientY, si, oppSide);
    if (targetPos !== null) {
      var epCls = oppSide === 'img' ? '.match-ep-right' : '.match-ep-left';
      var tep   = document.querySelector(
        '.match-item[data-si="' + si + '"][data-side="' + oppSide + '"][data-pos="' + targetPos + '"] ' + epCls);
      if (tep) tep.classList.add('match-ep-hover');
    }
    updateMatchSvg(si, rb);
    return;
  }

  posGhost(dragging.ghost, e.clientX, e.clientY);
  document.querySelectorAll('.q-blank').forEach(function(b){ b.classList.remove('drag-over'); });
  var t = findDropBlank(e.clientX, e.clientY, dragging);
  if (t) t.classList.add('drag-over');
}

function onDragEnd(e) {
  document.removeEventListener('pointermove',   onDragMove);
  document.removeEventListener('pointerup',     onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);
  if (_scrollRAF) { cancelAnimationFrame(_scrollRAF); _scrollRAF = null; }
  if (!dragging) return;
  var info = dragging;
  dragging = null;
  document.querySelectorAll('.match-ep').forEach(function(ep) { ep.classList.remove('match-ep-hover'); });

  if (info.dragKind === 'match-connect') {
    var si      = info.si;
    var oppSide = info.side === 'img' ? 'word' : 'img';
    var tPos    = findMatchEndpointAt(e.clientX || 0, e.clientY || 0, si, oppSide);
    if (tPos !== null) {
      var imgPos  = info.side === 'img' ? info.pos : tPos;
      var wordPos = info.side === 'img' ? tPos : info.pos;
      doConnect(si, imgPos, wordPos);
    } else {
      updateMatchSvg(si); /* clear rubber-band */
    }
    return;
  }

  document.querySelectorAll('.q-blank').forEach(function(b){ b.classList.remove('drag-over'); });
  if (info.ghost) info.ghost.remove();
  var target = findDropBlank(e.clientX, e.clientY, info);
  target ? doPlace(info.word, info.fromQIdx, parseInt(target.dataset.qidx))
         : renderAll();
}

/* ════════════ Drop detection — text blanks ════════════ */
function findDropBlank(x, y, info) {
  var best = null, bestDist = Infinity;
  document.querySelectorAll('.q-blank').forEach(function(el) {
    var qIdx = parseInt(el.dataset.qidx);
    var q    = quizData[qIdx];
    if (!q || POOL_KEY[q.type] !== info.poolKey) return;
    if (info.fromQIdx === qIdx) return;
    var r  = el.getBoundingClientRect();
    if (x < r.left - DROP_TOL || x > r.right  + DROP_TOL ||
        y < r.top  - DROP_TOL || y > r.bottom + DROP_TOL) return;
    var dist = Math.sqrt(Math.pow(x - (r.left + r.width/2), 2) +
                         Math.pow(y - (r.top  + r.height/2), 2));
    if (dist < bestDist) { bestDist = dist; best = el; }
  });
  return best;
}

/* ════════════ Place word ════════════ */
function doPlace(word, fromQIdx, toQIdx) {
  if (fromQIdx !== null) blanks[fromQIdx] = undefined;
  blanks[toQIdx] = word;
  renderAll();
}


/* ════════════ Submit / Grade ════════════ */
function submitQuiz() {
  if (graded) return;
  var unanswered = quizData.filter(function(q, i){ return getAnswer(i) === undefined; }).length;
  var matchUnanswered = 0;
  matchData.forEach(function(msec, si) {
    var conns = matchConnections[si] || {};
    (msec.imgOrder || []).forEach(function(_, imgPos) {
      if (conns[imgPos] === undefined) matchUnanswered++;
    });
  });
  var totalUnanswered = unanswered + matchUnanswered;
  if (totalUnanswered > 0 && !confirm('還有 ' + totalUnanswered + ' 題未作答，確定要送出嗎？')) return;

  graded = true;
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.getElementById('btn-submit').disabled = true;

  document.querySelectorAll('.pool-word').forEach(function(el){
    el.style.pointerEvents = 'none';
    el.style.cursor        = 'default';
    el.style.opacity       = '.4';
  });

  /* Pre-calculate text question totals */
  var correct = 0, wrongIndices = [];
  quizData.forEach(function(q, i) {
    var ua      = getAnswer(i);
    var isRight = ua !== undefined && ua === q.answer;
    if (isRight) correct++; else wrongIndices.push(i);
  });

  /* Pre-calculate match totals */
  var matchCorrect = 0, matchTotal = 0;
  matchData.forEach(function(msec, si) {
    var conns = matchConnections[si] || {};
    (msec.imgOrder || []).forEach(function(pairIdx, imgPos) {
      matchTotal++;
      var wordPos = conns[imgPos];
      if (wordPos !== undefined && msec.wordOrder[wordPos] === pairIdx) matchCorrect++;
    });
  });

  /* Staggered per-question reveal: 120 ms between each */
  var STAGGER = 120;
  quizData.forEach(function(q, i) {
    var ua      = getAnswer(i);
    var isRight = ua !== undefined && ua === q.answer;
    setTimeout(function() { _applyGradeVisual(q, i, ua, isRight); }, i * STAGGER + 160);
  });
  /* Match sections reveal after text questions — re-render with graded classes + SVG color */
  var matchDelay = quizData.length * STAGGER + 160;
  setTimeout(function() { if (graded) renderMatchSections(); }, matchDelay);

  /* Show result after all animations complete */
  var totalDelay = (quizData.length + (matchData.length ? 1 : 0)) * STAGGER + 480;
  var snapCorrect = correct, snapMatchCorrect = matchCorrect;
  var snapWrong = wrongIndices.slice();
  var snapTotal  = quizData.length + matchTotal;
  setTimeout(function() {
    if (!graded) return;
    var score = snapTotal ? Math.round((snapCorrect + snapMatchCorrect) / snapTotal * 100) : 100;
    saveScore(score, snapCorrect + snapMatchCorrect, snapTotal);
    showResult(snapCorrect, quizData.length, snapWrong, snapMatchCorrect, matchTotal);
  }, totalDelay);
}

function _applyGradeVisual(q, i, ua, isRight) {
  if (!graded) return; /* guard: quiz was reset before this callback fired */
  if (q.type === '選擇題') {
    var block = document.getElementById('qb-' + i);
    var icon  = document.getElementById('icon-' + i);
    if (block) block.classList.add(isRight ? 'graded-correct' : 'graded-wrong');
    if (icon)  icon.textContent = isRight ? '✓' : '✗';
    /* Match buttons by data-opt-text (position-independent) */
    document.querySelectorAll('#qb-' + i + ' .opt-btn').forEach(function(btn) {
      btn.disabled = true;
      if (btn.dataset.optText === q.answer)          btn.classList.add('correct');
      else if (btn.dataset.optText === ua && !isRight) btn.classList.add('wrong');
    });
    if (!isRight) {
      var hint = document.getElementById('hint-' + i);
      if (hint) hint.textContent = '正確答案：' + q.answer;
    }
  } else {
    var row     = document.getElementById('qr-' + i);
    var blankEl = document.getElementById('blank-' + i);
    if (row) row.classList.add(isRight ? 'graded-correct' : 'graded-wrong');
    if (blankEl) {
      blankEl.innerHTML = ua ? escHtml(ua) : '';
      if (ua) { blankEl.classList.add('filled'); blankEl.classList.remove('blank-placeholder'); }
    }
  }
}

/* ════════════ Score count-up ════════════ */
function _countUp(el, target, duration) {
  if (_countUpRAF) { cancelAnimationFrame(_countUpRAF); _countUpRAF = null; }
  var start = null;
  function step(ts) {
    if (!start) start = ts;
    var t = Math.min((ts - start) / duration, 1);
    var eased = 1 - Math.pow(1 - t, 3); /* ease-out cubic */
    el.textContent = Math.round(eased * target);
    if (t < 1) _countUpRAF = requestAnimationFrame(step);
    else _countUpRAF = null;
  }
  _countUpRAF = requestAnimationFrame(step);
}

/* ════════════ Result screen ════════════ */
function showResult(correct, total, wrongIndices, matchCorrect, matchTotal) {
  var allCorrect = correct + (matchCorrect || 0);
  var allTotal   = total   + (matchTotal   || 0);
  var score = allTotal ? Math.round(allCorrect / allTotal * 100) : 100;
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').classList.add('show');
  var scoreEl = document.getElementById('result-score');
  scoreEl.textContent = '0';
  _countUp(scoreEl, score, 900);
  document.getElementById('result-title').textContent =
    score >= 90 ? '太厲害了！🎉' : score >= 70 ? '做得很好！👍' :
    score >= 50 ? '繼續加油！💪' : '多多練習吧！📖';
  var subParts = ['共答對 ' + allCorrect + ' 題，答錯 ' + (allTotal - allCorrect) + ' 題'];
  if (matchTotal) subParts.push('詞圖配對 ' + (matchCorrect || 0) + '/' + matchTotal + ' 組');
  document.getElementById('result-sub').textContent = subParts.join('　');
  document.getElementById('review-container').innerHTML =
    wrongIndices.length ? buildReviewHtml(wrongIndices) : '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildReviewHtml(wrongIndices) {
  return '<div class="review-section">' +
    '<div class="review-header">錯誤題目解析</div>' +
    wrongIndices.map(function(i) {
      var q      = quizData[i];
      var ua     = getAnswer(i);
      var before = quizData.slice(0, i).filter(function(qq){ return qq.type === q.type; }).length;
      var label  = q.type + '　第 ' + (before + 1) + ' 題';
      var ansHtml;
      if (q.type === '選擇題') {
        var co = q.answer;           /* correct option plain text */
        var uo = ua || '未作答';     /* selected option plain text */
        ansHtml = '<div class="review-answers">' +
          '<span class="review-wrong-ans">'   + escHtml(uo) + '</span>' +
          '<span class="review-arrow">→</span>' +
          '<span class="review-correct-ans q-speakable" onclick="speakText(\'' + escJs(co) + '\')">' + escHtml(co) + '</span></div>';
      } else {
        /* 詞語填空：唸完整句（答案嵌入空格）；詞語解釋：唸答案本身 */
        var fullSentence = q.type === '詞語填空'
          ? q.question.replace(/[（(][^）)]*[）)]/, q.answer)
          : q.answer;
        ansHtml = '<div class="review-answers">' +
          '<span class="review-wrong-ans">你填：'  + escHtml(ua || '未作答') + '</span>' +
          '<span class="review-arrow">→</span>' +
          '<span class="review-correct-ans q-speakable" onclick="speakText(\'' + escJs(fullSentence) + '\')" title="點擊聆聽">正確：' + escHtml(q.answer) + '</span></div>';
      }
      return '<div class="review-item">' +
        '<div class="review-item-label">' + escHtml(label)       + '</div>' +
        '<div class="review-item-q q-speakable" onclick="speakText(\'' +
          escJs(q.question) + '\')">'     + escHtml(q.question)  + '</div>' +
        ansHtml + '</div>';
    }).join('') +
  '</div>';
}

/* ════════════ Save to Firestore ════════════ */
function saveScore(score, correct, total) {
  if (!db || !student) return;
  var now   = new Date().toISOString();
  var grade  = (quizData[0] && quizData[0].grade)  || '練習卷';
  var lesson = (quizData[0] && quizData[0].lesson) || '';

  /* 原有：個人活動紀錄 */
  db.collection('students').doc(student.id).collection('activities').add({
    app: 'chinese-quiz', score: score, correct: correct, total: total,
    grade: grade, lesson: lesson, timestamp: now
  }).catch(function(){});

  /* 新增：跨學生可查詢的測驗結果（教師看最高分、學生看歷史） */
  if (currentSession && currentSession.sessionId) {
    db.collection('quizResults').add({
      sessionId:   currentSession.sessionId,
      sessionCode: currentSession.sessionCode,
      sessionName: currentSession.sessionName,
      teacherUid:  currentSession.teacherUid,
      studentId:   student.id,
      studentName: student.nickname || student.name || '',
      score:       score,
      correct:     correct,
      total:       total,
      grade:       grade,
      lesson:      lesson,
      lessonName:  (currentSettings && currentSettings.lessonName) || '',
      timestamp:   now
    }).catch(function(){});
  }
}

/* ════════════ Retry ════════════ */
function retryQuiz() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  matchConnections = {};
  loadQuestions(); /* re-reads quiz_settings → fresh random sample from same lesson */
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
