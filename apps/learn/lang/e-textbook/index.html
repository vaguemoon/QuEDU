<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4a90d9">
<title>課文趣｜上學趣</title>
<link rel="manifest" href="/QuEDU/manifest.json">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="../../../../shared/shared.css">
<script>
(function(){var M={blue:'#eef5fc,#4a90d9,#2d6fa8,#e8f4fd',green:'#edfbf4,#27ae60,#1e8449,#d5f5e3',
  purple:'#f3f0fc,#8e44ad,#6c3483,#e8daef',orange:'#fff8f0,#e67e22,#ca6f1e,#fdebd0',
  teal:'#f0fafa,#16a085,#0e6655,#d1f2eb',pink:'#fff0f8,#d63384,#a0255e,#fce4ec'};
  try{var v=(M[localStorage.getItem('theme')]||M.blue).split(','),r=document.documentElement.style;
  ['--bg','--blue','--blue-dk','--blue-lt'].forEach(function(k,i){r.setProperty(k,v[i]);});}catch(e){}})();
</script>
<link rel="stylesheet" href="e-textbook.css">
</head>
<body>

<!-- ── 頂端列 ── -->
<div id="page-topbar">
  <button class="btn-back-hub" onclick="backToHub()">← 主頁</button>
  <button class="btn-back hidden" id="topbar-back" onclick="goBack()">← 返回</button>
  <div id="topbar-title">📖 <span>課文趣</span></div>
  <div id="topbar-student" onclick="toggleLogoutMenu()">
    <span id="topbar-avatar">🐣</span>
    <span id="topbar-name">—</span>
    <div id="topbar-logout-menu" class="logout-menu hidden">
      <button class="lm-btn lm-settings" onclick="goToSettings(event)">⚙️ 設定</button>
      <button class="lm-btn lm-logout"   onclick="sendLogout(event)">🚪 登出</button>
    </div>
  </div>
</div>

<!-- ── 課文清單（老師分享給這個班級的課文） ── -->
<div id="page-list" class="page active">
  <div class="et-page-inner">
    <div class="et-list-title">📖 老師分享的課文</div>
    <div id="et-list-wrap"><div class="loading-wrap"><div class="spinner"></div></div></div>
  </div>
</div>

<!-- ── 課文閱讀 ── -->
<div id="page-reader" class="page">
  <div class="et-sticky-head">
    <div class="et-progress-bar">
      <div class="et-progress-title">📊 本課生字詞</div>
      <div class="et-progress-track"><div class="et-progress-fill" id="et-progress-fill" style="width:0%"></div></div>
      <div class="et-progress-counts" id="et-progress-counts"></div>
    </div>

    <div class="et-toolbar">
      <div class="et-adjust-group">
        <div class="et-font-group">
          <span class="et-rate-label">字體</span>
          <button class="et-font-btn" onclick="etAdjustFontSize(-1)">Ａ－</button>
          <button class="et-font-btn" onclick="etAdjustFontSize(1)">Ａ＋</button>
        </div>
        <div class="et-rate-group">
          <span class="et-rate-label">語速</span>
          <button class="et-font-btn" onclick="etAdjustRate(-1)">－</button>
          <span class="et-rate-value" id="et-rate-value">0.75x</span>
          <button class="et-font-btn" onclick="etAdjustRate(1)">＋</button>
        </div>
      </div>
    </div>
  </div>

  <div id="et-text-wrap" class="et-text-wrap"></div>

  <div id="et-found-panel" class="et-found-panel"></div>
</div>

<!-- ── 圈詞查詢彈窗 ── -->
<div id="et-lookup-popup" class="et-lookup-popup">
  <button class="et-lookup-close" onclick="etCloseLookup()">✕</button>
  <div class="et-lookup-word" id="et-lookup-word"></div>
  <div class="et-lookup-bopomofo" id="et-lookup-bopomofo"></div>
  <img class="et-lookup-image" id="et-lookup-image" alt="">
  <div class="et-lookup-def" id="et-lookup-def"></div>
  <div class="et-lookup-found-badge" id="et-lookup-found-badge">🎉 找到本課生字詞！</div>
</div>

<!-- ── 設定 ── -->
<div id="page-settings" class="page">
  <div class="settings-body">
    <div class="settings-section-title">🐾 頭像</div>
    <div id="settings-avatar-grid"></div>
    <div class="settings-section-title">🎨 主題色系</div>
    <div id="theme-grid"></div>
    <div class="settings-section-title">🔊 音效</div>
    <div class="sound-row">
      <span class="sound-label">練習音效</span>
      <button class="sound-toggle-btn" id="sound-toggle-btn" onclick="toggleSound();applySound();">
        <div class="sound-toggle-knob" id="sound-toggle-knob"></div>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="../../../../shared/shared.js"></script>
<script src="js/nav.js"></script>
<script src="js/state.js"></script>
<script src="js/voice.js"></script>
<script src="js/reader.js"></script>
<script src="js/init.js"></script>
<link rel="stylesheet" href="../../../../shared/report.css">
<script src="../../../../shared/report.js"></script>
<script>initReportWidget({ role: 'student' });</script>
<link rel="stylesheet" href="../../../../shared/scratch.css">
<script src="../../../../shared/scratch.js"></script>
<script>initScratchWidget();</script>
<link rel="stylesheet" href="../../../../shared/voice-to-text.css">
<script src="../../../../shared/voice-to-text.js"></script>
<script>initVoiceToTextWidget();</script>
</body>
</html>
