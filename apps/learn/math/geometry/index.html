<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4a90d9">
<title>幾何趣｜上學趣</title>
<link rel="manifest" href="/QuEDU/manifest.json">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="../../../../shared/shared.css">
<script>
(function(){var M={blue:'#eef5fc,#4a90d9,#2d6fa8,#e8f4fd',green:'#edfbf4,#27ae60,#1e8449,#d5f5e3',
  purple:'#f3f0fc,#8e44ad,#6c3483,#e8daef',orange:'#fff8f0,#e67e22,#ca6f1e,#fdebd0',
  teal:'#f0fafa,#16a085,#0e6655,#d1f2eb',pink:'#fff0f8,#d63384,#a0255e,#fce4ec'};
  try{var v=(M[localStorage.getItem('theme')]||M.blue).split(','),r=document.documentElement.style;
  ['--bg','--blue','--blue-dk','--blue-lt'].forEach(function(k,i){r.setProperty(k,v[i]);});}catch(e){}})();
</script>
<link rel="stylesheet" href="geometry.css">
</head>
<body>

<!-- ══════════════════ TOPBAR ══════════════════ -->
<div id="page-topbar">
  <button class="btn-back-hub" onclick="backToHub()">← 主頁</button>
  <button class="btn-back hidden" id="topbar-back" onclick="goBack()">← 返回</button>
  <div id="topbar-title">📐 <span>幾何趣</span></div>
  <div id="topbar-right">
    <div id="topbar-student" onclick="toggleLogoutMenu()">
      <span id="topbar-avatar">🐣</span>
      <span id="topbar-name">—</span>
      <div id="topbar-logout-menu" class="logout-menu hidden">
        <button class="lm-btn" onclick="goToSettings(event)">⚙️ 設定</button>
        <button class="lm-btn lm-logout" onclick="sendLogout(event)">🚪 登出</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════ PAGE: HOME ══════════════════ -->
<div id="page-home" class="page page-fill active">
  <div class="home-wrap">
    <div class="home-title">📐 幾何趣</div>
    <div class="home-sub">選擇練習項目</div>
    <div class="module-cards">
      <button class="module-card module-card--area" onclick="openModule('area')">
        <div class="module-card-icon">▭</div>
        <div class="module-card-info">
          <div class="module-card-title">面積計算</div>
          <div class="module-card-sub">長方形・三角形・圓形⋯</div>
        </div>
      </button>
      <button class="module-card module-card--volume" onclick="openModule('volume')">
        <div class="module-card-icon">▣</div>
        <div class="module-card-info">
          <div class="module-card-title">體積計算</div>
          <div class="module-card-sub">正方體・長方體・圓柱⋯</div>
        </div>
      </button>
      <button class="module-card module-card--surface" onclick="openModule('surface')">
        <div class="module-card-icon">⬡</div>
        <div class="module-card-info">
          <div class="module-card-title">表面積計算</div>
          <div class="module-card-sub">展開圖・各面加總</div>
        </div>
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════ PAGE: SELECT ══════════════════ -->
<div id="page-select" class="page">
  <div id="select-body" class="select-body"></div>
</div>

<!-- ══════════════════ PAGE: GAME ══════════════════ -->
<div id="page-game" class="page">
  <div class="game-layout" id="game-layout">

    <!-- ── 左側：題目 + 數字鍵盤 ── -->
    <div class="game-left">
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-label">題號</span>
          <span class="stat-val" id="game-qnum">1</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">答對</span>
          <span class="stat-val" id="game-correct">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">剩餘</span>
          <span class="stat-val" id="game-remain">10</span>
        </div>
      </div>

      <div id="game-question-area" class="q-area"></div>

      <button class="btn-hint" id="btn-hint" onclick="playHint()">💡 看提示</button>

      <div class="fill-pad" id="game-fill-pad">
        <div class="fill-pad-row">
          <button class="fill-btn" onclick="fillAppend('7')">7</button>
          <button class="fill-btn" onclick="fillAppend('8')">8</button>
          <button class="fill-btn" onclick="fillAppend('9')">9</button>
        </div>
        <div class="fill-pad-row">
          <button class="fill-btn" onclick="fillAppend('4')">4</button>
          <button class="fill-btn" onclick="fillAppend('5')">5</button>
          <button class="fill-btn" onclick="fillAppend('6')">6</button>
        </div>
        <div class="fill-pad-row">
          <button class="fill-btn" onclick="fillAppend('1')">1</button>
          <button class="fill-btn" onclick="fillAppend('2')">2</button>
          <button class="fill-btn" onclick="fillAppend('3')">3</button>
        </div>
        <div class="fill-pad-row">
          <button class="fill-btn fill-del" onclick="fillBackspace()">⌫</button>
          <button class="fill-btn fill-dot" id="fill-dot-key" onclick="fillAppend('.')">.</button>
          <button class="fill-btn" onclick="fillAppend('0')">0</button>
          <button class="fill-btn fill-ok" onclick="onGameSubmit()">✓</button>
        </div>
      </div>

      <button class="btn-end-practice" onclick="goBack()">結束練習</button>
    </div>

    <!-- ── 右側：SVG 沙盒 ── -->
    <div class="game-right" id="game-right">
      <div id="geo-sandbox">
        <svg id="sandbox-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"
             preserveAspectRatio="xMidYMid meet" style="overflow:hidden"></svg>
      </div>
    </div>

  </div>
</div>

<!-- ══════════════════ PAGE: RESULT ══════════════════ -->
<div id="page-result" class="page">
  <div class="result-wrap">
    <div class="result-icon" id="result-icon">🎉</div>
    <div class="result-title" id="result-title">太厲害了！</div>
    <div class="result-sub" id="result-sub">答對 10 / 10 題</div>
    <div class="result-btns">
      <button class="btn-result" onclick="startGame()">再練一次</button>
      <button class="btn-result" onclick="showPage('select')">換形狀</button>
      <button class="btn-result btn-result-home"
              onclick="showPage('home',false);PAGE_STACK=['home'];">回首頁</button>
    </div>
  </div>
</div>

<!-- ══════════════════ PAGE: SETTINGS ══════════════════ -->
<div id="page-settings" class="page">
  <div class="settings-body">
    <div class="settings-section-title">🐾 頭像</div>
    <div id="settings-avatar-grid" class="avatar-grid"></div>
    <div class="settings-section-title">🎨 主題色系</div>
    <div id="theme-grid"></div>
    <div class="settings-section-title">🔊 音效</div>
    <div class="sound-row">
      <span class="sound-label">練習音效</span>
      <button class="sound-toggle-btn" id="sound-toggle-btn" onclick="toggleSound();applySound();">
        <div class="sound-toggle-knob" id="sound-toggle-knob"></div>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="../../../../shared/shared.js"></script>
<script src="js/nav.js"></script>
<script src="js/state.js"></script>
<script src="js/questions.js"></script>
<script src="js/area-sandbox.js"></script>
<script src="js/vol-sandbox.js"></script>
<script src="js/surf-sandbox.js"></script>
<script src="js/game.js"></script>
<script src="js/init.js"></script>
<link rel="stylesheet" href="../../../../shared/report.css">
<script src="../../../../shared/report.js"></script>
<script>initReportWidget({ role: 'student' });</script>
<link rel="stylesheet" href="../../../../shared/scratch.css">
<script src="../../../../shared/scratch.js"></script>
<script>initScratchWidget();</script>
</body>
</html>
