<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4a90d9">
<title>知動趣｜上學趣</title>
<link rel="manifest" href="/QuEDU/manifest.json">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="../../../../shared/shared.css">
<script>
(function(){var M={blue:'#eef5fc,#4a90d9,#2d6fa8,#e8f4fd',green:'#edfbf4,#27ae60,#1e8449,#d5f5e3',
  purple:'#f3f0fc,#8e44ad,#6c3483,#e8daef',orange:'#fff8f0,#e67e22,#ca6f1e,#fdebd0',
  teal:'#f0fafa,#16a085,#0e6655,#d1f2eb',pink:'#fff0f8,#d63384,#a0255e,#fce4ec'};
  try{var v=(M[localStorage.getItem('theme')]||M.blue).split(','),r=document.documentElement.style;
  ['--bg','--blue','--blue-dk','--blue-lt'].forEach(function(k,i){r.setProperty(k,v[i]);});}catch(e){}})();
</script>
<link rel="stylesheet" href="motor.css">
</head>
<body>

<!-- ══════════════════ TOPBAR ══════════════════ -->
<div id="page-topbar">
  <button class="btn-back-hub" onclick="backToHub()">← 主頁</button>
  <button class="btn-back hidden" id="topbar-back" onclick="goBack()">← 返回</button>
  <div id="topbar-title">🧩 <span>知動趣</span></div>
  <div id="topbar-right">
    <div id="topbar-student" onclick="toggleLogoutMenu()">
      <span id="topbar-avatar">🐣</span>
      <span id="topbar-name">—</span>
      <div id="topbar-logout-menu" class="logout-menu hidden">
        <button class="lm-btn" onclick="goToSettings(event)">⚙️ 設定</button>
        <button class="lm-btn lm-logout" onclick="sendLogout(event)">🚪 登出</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════ PAGE: HOME ══════════════════ -->
<div id="page-home" class="page page-fill active">
  <div class="home-wrap">
    <div class="home-title">🧩 知動趣</div>
    <div class="home-sub">選擇想練習的遊戲</div>
    <div class="module-cards">
      <button class="module-card module-card--dot2dot" onclick="openModule('dot2dot')">
        <div class="module-card-icon">🔢</div>
        <div class="module-card-info">
          <div class="module-card-title">連連看</div>
          <div class="module-card-sub">依數字順序連成一張圖</div>
        </div>
      </button>
      <button class="module-card module-card--tracing" onclick="openModule('tracing')">
        <div class="module-card-icon">✏️</div>
        <div class="module-card-info">
          <div class="module-card-title">線條練習</div>
          <div class="module-card-sub">跟著虛線描出直線、曲線、圓圈</div>
        </div>
      </button>
      <button class="module-card module-card--match" onclick="openModule('match')">
        <div class="module-card-icon">🔍</div>
        <div class="module-card-info">
          <div class="module-card-title">找一樣</div>
          <div class="module-card-sub">從四個選項找出跟範本一樣的圖案</div>
        </div>
      </button>
      <button class="module-card module-card--grid" onclick="openModule('grid')">
        <div class="module-card-icon">🔢</div>
        <div class="module-card-info">
          <div class="module-card-title">方格抄寫</div>
          <div class="module-card-sub">看圖例把圖案換成數字填進格子</div>
        </div>
      </button>
      <button class="module-card module-card--color" onclick="openModule('color')">
        <div class="module-card-icon">🎨</div>
        <div class="module-card-info">
          <div class="module-card-title">著色小畫家</div>
          <div class="module-card-sub">看注音選顏色，把圖案塗上色</div>
        </div>
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════ PAGE: SELECT ══════════════════ -->
<div id="page-select" class="page">
  <div class="select-body">
    <div class="select-title" id="select-title">選擇關卡</div>
    <button class="btn-chain-start" id="btn-chain-start" onclick="startChain()">
      🚀 連續闖關（一關接一關，不用每關選）
    </button>
    <div class="level-grid" id="level-grid"></div>
  </div>
</div>

<!-- ══════════════════ PAGE: GAME ══════════════════ -->
<div id="page-game" class="page">
  <div class="game-layout">

    <div class="game-left">
      <div class="game-title" id="game-title">—</div>
      <div class="chain-badge hidden" id="chain-badge">🚀 連續闖關中</div>
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-label">進度</span>
          <span class="stat-val" id="game-progress">0</span>
        </div>
      </div>
      <div class="game-hint" id="game-hint"></div>
      <button class="btn-end-practice" onclick="endPractice()">結束練習</button>
    </div>

    <div class="game-right">
      <div id="motor-sandbox">
        <svg id="motor-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
             preserveAspectRatio="xMidYMid meet"></svg>
      </div>

      <div id="match-sandbox" class="hidden">
        <div class="match-reference">
          <div class="match-ref-label">範本</div>
          <svg id="match-ref-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="match-options" id="match-options"></div>
      </div>

      <div id="grid-sandbox" class="hidden">
        <div class="grid-legend" id="grid-legend"></div>
        <div class="grid-pair">
          <div class="grid-box">
            <div class="grid-box-label">看這個</div>
            <div class="grid-cells" id="grid-source"></div>
          </div>
          <div class="grid-arrow">➡️</div>
          <div class="grid-box">
            <div class="grid-box-label">填這個</div>
            <div class="grid-cells" id="grid-target"></div>
          </div>
        </div>
        <div class="grid-picker hidden" id="grid-picker"></div>
      </div>

      <div id="color-sandbox" class="hidden">
        <svg id="color-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
             preserveAspectRatio="xMidYMid meet"></svg>
        <div class="color-palette" id="color-palette"></div>
      </div>
    </div>

  </div>
</div>

<!-- ══════════════════ PAGE: RESULT ══════════════════ -->
<div id="page-result" class="page">
  <div class="result-wrap">
    <div class="result-icon" id="result-icon">🎉</div>
    <div class="result-title" id="result-title">太棒了！</div>
    <div class="result-sub" id="result-sub"></div>
    <div class="result-btns" id="result-btns">
      <button class="btn-result" onclick="replayLevel()">再玩一次</button>
      <button class="btn-result" onclick="backToLevelSelect()">換關卡</button>
      <button class="btn-result btn-result-home" onclick="backToHome()">回首頁</button>
    </div>
  </div>
</div>

<!-- ══════════════════ PAGE: SETTINGS ══════════════════ -->
<div id="page-settings" class="page">
  <div class="settings-body">
    <div class="settings-section-title">🐾 頭像</div>
    <div id="settings-avatar-grid" class="avatar-grid"></div>
    <div class="settings-section-title">🎨 主題色系</div>
    <div id="theme-grid"></div>
    <div class="settings-section-title">🔊 音效</div>
    <div class="sound-row">
      <span class="sound-label">練習音效</span>
      <button class="sound-toggle-btn" id="sound-toggle-btn" onclick="toggleSound();applySound();">
        <div class="sound-toggle-knob" id="sound-toggle-knob"></div>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="../../../../shared/shared.js"></script>
<script src="js/nav.js"></script>
<script src="js/state.js"></script>
<script src="js/voice.js"></script>
<script src="js/dot2dot-data.js"></script>
<script src="js/dot2dot.js"></script>
<script src="js/tracing-data.js"></script>
<script src="js/tracing.js"></script>
<script src="js/match-data.js"></script>
<script src="js/match.js"></script>
<script src="js/grid-data.js"></script>
<script src="js/grid.js"></script>
<script src="js/color-data.js"></script>
<script src="js/color.js"></script>
<script src="js/game.js"></script>
<script src="js/init.js"></script>
<link rel="stylesheet" href="../../../../shared/report.css">
<script src="../../../../shared/report.js"></script>
<script>initReportWidget({ role: 'student' });</script>
<link rel="stylesheet" href="../../../../shared/scratch.css">
<script src="../../../../shared/scratch.js"></script>
<script>initScratchWidget();</script>
<link rel="stylesheet" href="../../../../shared/voice-to-text.css">
<script src="../../../../shared/voice-to-text.js"></script>
<script>initVoiceToTextWidget();</script>
</body>
</html>
